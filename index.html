<style>

*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}

button.b.g{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}button.b:disabled{opacity:.45;cursor:not-allowed}

const DATA=[{"name": "Practice Test 1", "q": [{"q": "During a review of your eventstream pipeline, you discover that IoT sensor data is not being enriched with calculated priority fields. Which transformation step should be implemented to resolve this issue?", "o": ["Custom endpoint", "Use a Filter transformation to remove invalid data, then route to Fabric Activator for high-temperature alerts", "Manage fields transformation to change data types and rename fields", "Manage fields transformation"], "a": [3], "e": "Adding derived or calculated fields to event payloads is handled via the Manage fields transformation.", "t": 2}, {"q": "Which Dataflow Gen2 capability is designed for high-throughput ingestion of large volumes with little or no transformation?", "o": ["Fast copy", "Data wrangler", "Query parameters", "Z-order"], "a": [0], "e": "Fast copy uses the Copy engine for large loads. It falls back to the standard engine if its conditions are not met.", "t": 0}, {"q": "You append a DataFrame with an extra column to a Delta table and the write fails. Why, and how do you allow the new column?", "o": ["A V-Order conflict; disable V-Order", "Schema enforcement; use option('mergeSchema','true')", "The table is a shortcut; delete it", "Retention; run VACUUM"], "a": [1], "e": "Delta rejects writes that do not match the schema unless schema evolution is enabled with mergeSchema.", "t": 1}, {"q": "Where should you land raw CSV, JSON, or image files in a lakehouse?", "o": ["Tables", "Files", "Shortcuts only", "The SQL endpoint"], "a": [1], "e": "Files accepts any format, which suits bronze landing zones.", "t": 1}, {"q": "Which string operator is generally faster than the others for term searches on a large KQL table?", "o": ["contains", "matches regex", "has", "search *"], "a": [2], "e": "has uses the term index. contains is a substring scan, and == is fastest for exact matches.", "t": 2}, {"q": "A Dataflow Gen2 with heavy transformations over a large dataset runs slowly in the mashup engine. Which setting offloads work to SQL compute on staged data?", "o": ["Disable query folding", "Switch to Import mode", "Enable high concurrency", "Enable staging"], "a": [3], "e": "With staging enabled, data lands in a staging item and transformations run on SQL compute, which usually speeds up heavy, non-folding work.", "t": 0}, {"q": "Where does Fabric store all workload data, and in which open format do lakehouse tables default?", "o": ["OneLake, Delta (Parquet plus a transaction log)", "Azure SQL, CSV", "A separate store per workload, ORC", "OneDrive, JSON"], "a": [0], "e": "OneLake is the single logical lake ('OneDrive for data'), and tables are Delta format.", "t": 1}, {"q": "What is the main benefit of high concurrency mode for notebooks?", "o": ["It enables V-Order automatically", "Several notebooks share one Spark session, cutting start time and cost", "It adds nodes beyond capacity", "It disables autoscale"], "a": [1], "e": "Notebooks with matching user, workspace, default lakehouse, and configuration can share a session.", "t": 0}, {"q": "What is the fastest way to ingest a one-off CSV file into a KQL table?", "o": ["Write a Spark streaming job", "Create a deployment pipeline", "Use a Warehouse COPY INTO", "Get data in the KQL database (one-click ingestion)"], "a": [3], "e": "The Get data experience infers the schema and creates the table and mapping for you.", "t": 0}, {"q": "Which feature stores historical query information in system views so you can analyze past queries?", "o": ["Query insights (the queryinsights schema)", "sys.tables", "INFORMATION_SCHEMA.COLUMNS", "Only the live DMVs"], "a": [0], "e": "Query insights keeps history such as exec_requests_history, long_running_queries, and frequently_run_queries.", "t": 3}, {"q": "Which workspace roles are not restricted by OneLake data access roles?", "o": ["Admin, Member, and Contributor", "Viewer only", "Only users with ReadData", "Nobody, everyone is restricted"], "a": [0], "e": "Admin, Member, and Contributor always have full access. OneLake data access roles govern Viewers and users shared with ReadAll.", "t": 4}, {"q": "In designing a data pipeline using the eventstream canvas, your task is to ensure that IoT sensor data is processed to remove invalid data and then routed for high-temperature alerts. What series of transformations and destinations should you configure?", "o": ["Use a Filter transformation to remove invalid data, then route to Fabric Activator for high-temperature alerts", "The destination endpoint is incorrectly configured or unreachable", "Custom endpoint", "Manage fields transformation"], "a": [0], "e": "A Filter transformation purges invalid readings, and the high-temperature alert condition routes to Fabric Activator for automated alerting.", "t": 2}, {"q": "You need a test copy of a large table without duplicating the data. What do you use?", "o": ["CTAS", "Zero-copy clone (CREATE TABLE ... AS CLONE OF)", "COPY INTO", "An export to CSV"], "a": [1], "e": "Clones reference the same underlying files, so they are fast and cheap.", "t": 3}, {"q": "Which command lists failed ingestions in a KQL database?", "o": [".show queries", ".show ingestion failures", ".show tables", ".show cache"], "a": [1], "e": "It shows failure reasons such as mapping errors or malformed records.", "t": 2}, {"q": "Which layer typically serves Power BI via a Direct Lake semantic model?", "o": ["Bronze", "Gold", "Landing Files only", "Environment"], "a": [1], "e": "Gold has business-ready aggregates or a star schema. Direct Lake reads the Delta files directly, falling back to DirectQuery if limits are exceeded.", "t": 1}, {"q": "A dataflow that usually finishes in 4 minutes suddenly takes 20 minutes but still shows a Succeeded status. What should you do?", "o": ["To provide a centralized view of recent activity status across a workspace, including the ability to view details and historical runs.", "It adds a summary and inline comments to describe the query's functionality.", "Investigate the cause by viewing activity details and comparing against historical runs to identify what changed.", "Deployment pipelines automate the movement of content through the development, test, and production stages."], "a": [2], "e": "Comparing execution metrics against historical baselines in the activity details allows diagnosis of performance regressions before failures occur.", "t": 5}, {"q": "Your company requires frequent updates to the DimProduct table to reflect changing product details. Which T-SQL statement ensures that updates are performed efficiently without duplicating existing records?", "o": ["Use slowly changing dimensions to track changes to customer data over time.", "MERGE statement to efficiently update and insert product details.", "Azure Data Lake Storage Gen2, Azure Blob Storage, and OneLake lakehouse folders.", "IntelliSense, code completion, and syntax highlighting"], "a": [1], "e": "The T-SQL MERGE statement atomically combines UPDATE and INSERT (upsert) logic based on key matching in a single optimized command.", "t": 3}, {"q": "How do you source-control and deploy a Warehouse schema with a database project?", "o": ["Build a .pbix file", "Package a .whl", "Build a .dacpac and publish it with SqlPackage", "Export CSV files"], "a": [2], "e": "A SQL database project builds to a .dacpac. SqlPackage computes the differences and applies them to the target.", "t": 5}, {"q": "What T-SQL pattern creates a new table from the results of a query across multiple warehouses in the same workspace?", "o": ["MERGE statement to efficiently update and insert product details.", "CREATE TABLE AS SELECT (CTAS)", "Microsoft Entra ID authentication", "sys.dm_exec_requests"], "a": [1], "e": "CREATE TABLE AS SELECT (CTAS) evaluates a query across warehouses using cross-database naming and writes the result into a new table in one parallelized operation.", "t": 3}, {"q": "A financial institution wants to flag unusual transaction patterns for immediate review using Microsoft Fabric Activator. Which type of action should they configure to ensure quick team coordination?", "o": ["Review the rule configuration to ensure the conditions are correctly set to trigger actions at the specified threshold.", "Rules", "By automatically sending alerts when shipments deviate from their expected paths, enabling quick corrective actions.", "Teams actions"], "a": [3], "e": "Microsoft Teams actions deliver contextual alert cards into team channels or chats for rapid human review and collaborative response.", "t": 2}, {"q": "Which Eventhouse policy keeps recent data on fast storage for quick queries?", "o": ["Retention", "Update", "Ingestion batching", "Caching (hot cache)"], "a": [3], "e": "The caching policy defines how much recent data stays hot. Retention controls when data is deleted.", "t": 2}, {"q": "Which item supports T-SQL INSERT, UPDATE, and DELETE?", "o": ["Lakehouse SQL analytics endpoint", "Warehouse", "Eventhouse", "Mirrored database endpoint"], "a": [1], "e": "A Warehouse is a full read/write T-SQL engine. The other endpoints are read-only for T-SQL.", "t": 3}, {"q": "Which view should you use to identify commonly run commands in your data warehouse?", "o": ["queryinsights.long_running_queries to get ranked execution times.", "Incremental load", "Append and Replace", "queryinsights.frequently_run_queries"], "a": [3], "e": "The queryinsights.frequently_run_queries view aggregates historical execution counts to spotlight repetitive workloads.", "t": 3}, {"q": "Which Git providers can a Fabric workspace connect to?", "o": ["Bitbucket and GitLab", "Azure DevOps and GitHub", "SVN and Perforce", "Only OneDrive"], "a": [1], "e": "Fabric Git integration supports Azure DevOps and GitHub (cloud).", "t": 5}, {"q": "In a star schema load, what is the correct order?", "o": ["Facts first", "Dimensions first, then facts", "Both in parallel with no ordering", "Date dimension last"], "a": [1], "e": "Facts look up dimension surrogate keys, so dimensions must be loaded first.", "t": 3}, {"q": "Your organization uses Microsoft Fabric to manage healthcare data. Team members need access to specific patient records but should not have access to insurance claims or clinical trial data. Which approach should you take to ensure the team members have the correct access within OneLake?", "o": ["Create a OneLake security role with ReadWrite permission for specified folders.", "Create OneLake security roles and restrict access to specific tables containing patient records.", "To apply granular permissions for accessing data through the SQL analytics endpoint.", "The user does not have the appropriate OneLake security role assigned."], "a": [1], "e": "OneLake security roles enable granular, table-level data access control within a lakehouse.", "t": 4}, {"q": "How do you return the latest reading per device in KQL?", "o": ["top 1 by Timestamp", "distinct DeviceId", "summarize arg_max(Timestamp, *) by DeviceId", "take 1"], "a": [2], "e": "arg_max returns the row with the maximum timestamp for each key. It is also the standard KQL deduplication pattern.", "t": 2}, {"q": "What happens when a user is granted a permission and then denied the same permission in a warehouse?", "o": ["Create a OneLake security role with ReadWrite permission for specified folders.", "To apply granular permissions for accessing data through the SQL analytics endpoint.", "The DENY always supersedes the GRANT, and the user is denied access to the specific object.", "It determines whether a row is accessible to a user based on certain conditions."], "a": [2], "e": "Under SQL permission precedence rules, an explicit DENY takes precedence over any GRANT.", "t": 4}, {"q": "What is the fastest UI action to turn a CSV in Files into a Delta table?", "o": ["Run VACUUM", "Create a dataflow only", "Create a deployment rule", "Load to Tables"], "a": [3], "e": "Load to Tables converts supported files (such as CSV and Parquet) into a Delta table.", "t": 1}, {"q": "How can you confirm that a Power Query step is being pushed down to the data source?", "o": ["Check the Spark UI", "Right-click the step and see whether View data source query (native query) is available", "Run OPTIMIZE", "Open the Capacity Metrics app"], "a": [1], "e": "If the native query option is enabled, the step folds to the source. A greyed-out option means folding stopped at or before that step.", "t": 0}, {"q": "What does Branch out to new workspace do?", "o": ["Deletes the main branch", "Copies data to a new capacity", "Creates an isolated workspace connected to a new feature branch", "Promotes content to Production"], "a": [2], "e": "It gives each developer an isolated workspace for a feature branch, merged later through a pull request.", "t": 5}, {"q": "Which KQL function detects anomalies in a series created with make-series?", "o": ["series_decompose_anomalies", "bin_at", "arg_min", "row_number"], "a": [0], "e": "It decomposes the series (trend, seasonality, residual) and flags outliers.", "t": 2}, {"q": "What does a deployment pipeline copy between stages?", "o": ["All data in tables", "Item metadata and definitions, not data", "Only permissions", "Only semantic models"], "a": [1], "e": "Data and permissions are not copied, so the target stage must have its own data and access setup.", "t": 5}, {"q": "Where are sensitivity labels that you apply to Fabric items defined?", "o": ["Azure Policy", "Microsoft Purview Information Protection", "Git", "Entra ID group settings"], "a": [1], "e": "Labels are created in Microsoft Purview and applied to Fabric items, with inheritance and protection settings governed by tenant policy.", "t": 4}, {"q": "What is the role of T-SQL permissions in Microsoft Fabric's security model?", "o": ["It determines whether a row is accessible to a user based on certain conditions.", "To apply granular permissions for accessing data through the SQL analytics endpoint.", "It provides access control within a Fabric item, allowing specification of table or folder access.", "The user does not have the appropriate OneLake security role assigned."], "a": [1], "e": "T-SQL permissions (GRANT, DENY, RLS, CLS, DDM) govern relational query access when querying via the SQL analytics endpoint.", "t": 4}, {"q": "What is required to use Copilot for Data Warehouse?", "o": ["Any trial", "A paid Fabric capacity (F2 or higher, or P1+) with the Copilot tenant setting enabled", "An on-premises server", "A Warehouse in Power BI Pro only"], "a": [1], "e": "Copilot needs a paid capacity and admin enablement (verify the current minimum SKU).", "t": 3}, {"q": "A shortcut placed under Tables that points to ADLS Gen2 must target what?", "o": ["Any CSV folder", "A zip archive", "A Delta table folder", "A SQL database"], "a": [2], "e": "For a shortcut to appear as a table, the target must be in Delta format (Files shortcuts accept any format).", "t": 1}, {"q": "How do you query a warehouse table as it existed at an earlier time?", "o": ["VERSION AS OF", "RESTORE", "DESCRIBE HISTORY", "OPTION (FOR TIMESTAMP AS OF ...)"], "a": [3], "e": "Warehouse time travel uses the FOR TIMESTAMP AS OF query hint within the retention window.", "t": 3}, {"q": "A viewer of a Real-Time Dashboard wants an email when a tile's value passes a threshold. What do you use?", "o": ["A deployment rule", "Set alert on the tile, which creates an Activator rule", "A Dataflow refresh", "A workspace identity"], "a": [1], "e": "Dashboard tiles can create Activator alerts that send email or Teams messages.", "t": 2}, {"q": "Which lakehouse component provides read-only T-SQL access to Delta tables?", "o": ["SQL analytics endpoint", "Eventhouse", "Deployment pipeline", "Data wrangler"], "a": [0], "e": "Every lakehouse gets an auto-generated SQL analytics endpoint. It supports queries and views, not data modification.", "t": 1}, {"q": "You need to copy data from an on-premises SQL Server into a lakehouse. What is required?", "o": ["A Spark custom pool", "An on-premises data gateway", "A KQL database", "An eventstream"], "a": [1], "e": "Private or on-premises sources are reached through an on-premises (or VNet) data gateway.", "t": 0}, {"q": "In a lakehouse, where are managed Delta tables that the SQL endpoint can discover stored?", "o": ["Files", "Notebooks", "Tables", "Environment"], "a": [2], "e": "The Tables section holds managed Delta tables. The Files section holds raw or unmanaged data.", "t": 1}, {"q": "Which Spark pool type gives the fastest session start in Fabric?", "o": ["Custom pool with XX-Large nodes", "A pool in another region", "A pool with autoscale off", "Starter pool"], "a": [3], "e": "Starter pools are pre-warmed, so sessions start in seconds. Custom pools take a few minutes.", "t": 0}, {"q": "What can a workspace Viewer do with a lakehouse by default?", "o": ["Read files through Spark", "Query through the SQL analytics endpoint but not browse lakehouse files or run Spark over them", "Write new tables", "Delete the lakehouse"], "a": [1], "e": "Viewers get read access through the SQL endpoint but need extra permissions (such as ReadAll) for OneLake or Spark access.", "t": 4}, {"q": "A pipeline fails on activity 5 of 7 due to a transient network error. What is the quickest way to finish the run?", "o": ["Recreate the pipeline", "Rerun from the failed activity", "Scale up the capacity", "Delete the earlier outputs and rerun everything"], "a": [1], "e": "Monitor hub and run details allow rerunning from the failed activity, so successful earlier steps are not repeated.", "t": 0}, {"q": "To comply with data privacy regulations, your company needs to ensure that non-administrative users cannot view full account numbers in the Fabric data warehouse. Which security feature should you implement?", "o": ["Dynamic data masking", "Assign compute permissions specific to the SQL analytics endpoint.", "The user does not have the appropriate OneLake security role assigned.", "Create a OneLake security role with ReadWrite permission for specified folders."], "a": [0], "e": "Dynamic data masking (DDM) obfuscates sensitive column values on the fly for non-privileged users without altering underlying data.", "t": 4}, {"q": "A user reports that they cannot access any data in a lakehouse even though they can see the lakehouse item in their workspace. What is the most likely cause of this issue?", "o": ["The DENY always supersedes the GRANT, and the user is denied access to the specific object.", "It determines whether a row is accessible to a user based on certain conditions.", "The user does not have the appropriate OneLake security role assigned.", "The user does not meet any condition in the RLS policy's predicate."], "a": [2], "e": "Lakehouse metadata visibility does not guarantee data access; users require assignment to an appropriate OneLake security role to read tables and files.", "t": 4}, {"q": "From a Warehouse, how do you query a lakehouse table in the same workspace?", "o": ["With an abfss:// path in T-SQL", "With a Spark session", "With a three-part name such as MyLakehouse.dbo.Orders", "It is not possible"], "a": [2], "e": "Cross-database queries use three-part names within a workspace.", "t": 3}, {"q": "How many stages can a deployment pipeline have?", "o": ["Exactly 3", "2 to 10 (3 by default: Development, Test, Production)", "Exactly 5", "Unlimited"], "a": [1], "e": "You can customize stage count and names within that range.", "t": 5}, {"q": "Which PySpark pattern saves a DataFrame as a managed Delta table partitioned by order_date?", "o": ["df.show(partition='order_date')", "df.cache().save()", "df.write.format('delta').partitionBy('order_date').saveAsTable('orders')", "spark.sql('PARTITION orders')"], "a": [2], "e": "saveAsTable registers a managed table, and partitionBy controls the layout. Partition only on low-cardinality columns.", "t": 1}]}, {"name": "Practice Test 2", "q": [{"q": "A Structured Streaming job must run continuously and restart automatically after failures. What should you use?", "o": ["A Spark job definition with a retry policy", "An interactive notebook cell", "A Dataflow Gen2", "A pipeline Wait activity"], "a": [0], "e": "Spark job definitions support retry policies for long-running jobs. Notebooks are interactive and not meant for always-on streams.", "t": 0}, {"q": "In Microsoft Fabric Activator, which detection approach would be suitable for alerting when a truck's temperature exceeds a predefined limit?", "o": ["By automatically sending alerts when shipments deviate from their expected paths, enabling quick corrective actions.", "Power Automate actions", "Threshold monitoring", "Review the rule configuration to ensure the conditions are correctly set to trigger actions at the specified threshold."], "a": [2], "e": "Threshold monitoring checks whether a metric value crosses a fixed ceiling or floor limit.", "t": 2}, {"q": "Dataflow Gen2 provides which low-code transformation experience?", "o": ["Spark notebooks only", "A KQL editor", "Power Query Online", "A visual T-SQL designer only"], "a": [2], "e": "Dataflow Gen2 is Power Query Online with the added ability to write to output destinations.", "t": 0}, {"q": "What is the purpose of the Real-Time hub?", "o": ["Store Delta tables for Spark", "Schedule pipelines", "Provide one place to discover, connect to, and manage streaming data across the tenant", "Host semantic models"], "a": [2], "e": "The Real-Time hub catalogs streams, Eventhouse tables, and Fabric events, and lets you start new connections from one location.", "t": 2}, {"q": "Which dynamic data masking function shows the first letter of an email address and masks the rest in the form aXXX@XXXX.com?", "o": ["default()", "random()", "partial()", "email()"], "a": [3], "e": "email() is the built-in masking function for email addresses.", "t": 3}, {"q": "Which item permission lets a user read lakehouse data through Spark and OneLake endpoints?", "o": ["ReadData", "Read", "Build", "ReadAll"], "a": [3], "e": "ReadAll grants access to the underlying OneLake data (and bypasses T-SQL row/column security). ReadData applies to the SQL endpoint.", "t": 4}, {"q": "How are statistics handled in a Fabric Warehouse?", "o": ["You must create all of them manually", "They are created and updated automatically, and you can also create them manually", "They are not used", "They exist only on clustered indexes"], "a": [1], "e": "The engine manages statistics. Manual CREATE STATISTICS or UPDATE STATISTICS helps after big loads.", "t": 3}, {"q": "Who can connect a workspace to a Git repository?", "o": ["Any Viewer", "Any Contributor", "A workspace Admin", "Any user in the tenant"], "a": [2], "e": "Connecting and disconnecting Git is a workspace Admin action. Contributors and above can then commit and update.", "t": 5}, {"q": "What is V-Order?", "o": ["A security role", "A write-time Parquet optimization that speeds reads, especially for Power BI/Direct Lake and the SQL endpoint", "A compression for CSV", "A KQL policy"], "a": [1], "e": "V-Order sorts and encodes Parquet for faster reads at some write cost. Defaults vary by workspace and profile (verify).", "t": 1}, {"q": "When creating a Real-Time Dashboard in Microsoft Fabric, why is it recommended to use base queries when working with multiple tiles?", "o": ["Organize the dashboard using multiple pages for different types of data.", "Correctly configured KQL query", "Parameters", "To avoid duplicating logic across multiple tiles and ensure consistent data retrieval."], "a": [3], "e": "Consolidating common logic guarantees data consistency and simplifies query maintenance across the dashboard.", "t": 2}, {"q": "How do you restrict a user to specific columns of a table in a Warehouse?", "o": ["A security policy", "Dynamic data masking", "GRANT SELECT ON table (col1, col2) TO user", "A label"], "a": [2], "e": "Column-level security uses column lists in GRANT or DENY.", "t": 3}, {"q": "Events  "CREATE TABLE ... AS SELECT (CTAS)", "LOAD TABLE"], "a": [2], "e": "CTAS is a set-based way to build a table from a query.", "t": 3}, {"q": "Which T-SQL option is the fastest way to bulk load files from storage into a Warehouse?", "o": ["COPY INTO", "Row-by-row INSERT", "A cursor loop", "A trigger"], "a": [0], "e": "COPY INTO is the high-throughput bulk path. Avoid single-row inserts.", "t": 3}, {"q": "Which transformation should be used to filter out invalid data in an eventstream pipeline?", "o": ["Subsequent transformations may produce inaccurate results or errors.", "Custom endpoint", "The destination endpoint is incorrectly configured or unreachable", "Filter"], "a": [3], "e": "The Filter transformation evaluates boolean expressions to retain valid events and drop invalid or malformed records.", "t": 2}, {"q": "In a medallion architecture, what belongs in the bronze layer?", "o": ["Final business aggregates", "Only deduplicated data", "Raw data as ingested, plus audit columns such as load time and source", "Semantic models"], "a": [2], "e": "Bronze keeps data as-is for replay and lineage, usually append-only.", "t": 1}, {"q": "Over what period are background operations (such as scheduled refreshes and Spark batch jobs) smoothed for capacity accounting?", "o": ["5 minutes", "About 24 hours", "1 hour", "They are not smoothed"], "a": [1], "e": "Background work is smoothed over about 24 hours, which is why short spikes do not immediately throttle a capacity.", "t": 5}, {"q": "Which Fabric item hosts one or more KQL databases with shared compute and caching for real-time data?", "o": ["Lakehouse", "Warehouse", "Eventhouse", "Data pipeline"], "a": [2], "e": "An Eventhouse is the container for KQL databases optimized for time-series and streaming data.", "t": 0}, {"q": "In Microsoft Fabric Activator, which action type should be used when you need to process and analyze data further after a condition is detected?", "o": ["Fabric item actions", "Teams actions", "Average", "Threshold monitoring"], "a": [0], "e": "Fabric item actions trigger downstream data processing workflows, such as launching a Fabric data pipeline or running a notebook.", "t": 2}, {"q": "In Microsoft Fabric, how can you ensure a user has ReadWrite access to only specific folders within a lakehouse, without granting workspace-wide write permissions?", "o": ["The user does not meet any condition in the RLS policy's predicate.", "It determines whether a row is accessible to a user based on certain conditions.", "Create a OneLake security role with ReadWrite permission for specified folders.", "To apply granular permissions for accessing data through the SQL analytics endpoint."], "a": [2], "e": "Scoping folder-level ReadWrite permissions inside a OneLake security role gives write access only where needed without granting broad workspace Contributor rights.", "t": 4}, {"q": "Your company needs to integrate event data into a custom application in real-time. Which eventstream destination should be configured to accomplish this?", "o": ["Join", "Manage fields transformation to change data types and rename fields", "The destination endpoint is incorrectly configured or unreachable", "Custom endpoint"], "a": [3], "e": "Custom endpoints provide an Event Hubs-compatible streaming endpoint that external bespoke systems and services can consume in real time.", "t": 2}, {"q": "Which loading pattern preserves existing data and adds only new or changed rows to a warehouse table?", "o": ["CREATE TABLE AS SELECT (CTAS)", "Incremental load", "sys.dm_exec_requests", "queryinsights.long_running_queries to get ranked execution times."], "a": [1], "e": "Incremental loading isolates source deltas to append new records and update modified rows without truncating existing data.", "t": 3}, {"q": "Where do you deduplicate, fix types, and apply data quality rules in a medallion design?", "o": ["Bronze", "Gold", "Power BI only", "Silver"], "a": [3], "e": "Silver holds cleansed, validated, ity alerts, then configure a derived stream to route alerts to a custom endpoint"], "a": [1], "e": "Corrupted or invalid records passing downstream cause calculation inaccuracies, casting exceptions, or aggregation errors.", "t": 2}, {"q": "When configuring an eventstream pipeline, you need to ensure that real-time data from Azure IoT Hub is transformed into a standardized format for downstream compatibility. Which transformation should you use to achieve this?", "o": ["Manage fields transformation to change data types and rename fields", "Custom endpoint", "Subsequent transformations may produce inaccurate results or errors.", "The destination endpoint is incorrectly configured or unreachable"], "a": [0], "e": "Manage fields directly enables field renaming and type casting to achieve downstream schema compatibility.", "t": 2}, {"q": "Your team has created a dashboard with multiple tiles showing bike availability data. Each tile uses a similar KQL query. What approach would best improve the maintainability of this dashboard?", "o": ["Implement a base query to handle the common data retrieval and have each tile query reference it.", "Interactive parameters for neighborhood-specific filtering.", "By consolidating shared logic into a single query that multiple tiles can reference.", "Correctly configured KQL query"], "a": [0], "e": "Future logic modifications only need to be applied in one place (the base query) rather than across every individual tile.", "t": 2}, {"q": "What does the grain of a fact table describe?", "o": ["The number of columns", "The level of detail that one row represents", "The partition key", "The clustering order"], "a": [1], "e": "For example, one row per order line per day. Declare the grain before designing the table.", "t": 3}, {"q": "A KQL join with no kind returns fewer rows than you expect. What is the most likely reason?", "o": ["The default kind is innerunique, which deduplicates the left side on the join key", "The default is fullouter", "Joins are limited to 100 rows", "Join sorts and trims the result"], "a": [0], "e": "Use kind=inner for a standard inner join and kind=leftouter for a left join.", "t": 2}, {"q": "A pipeline must run a PySpark transformation after files have been copied. Which activity do you add?", "o": ["Notebook", "Stored procedure", "Set variable", "Get Metadata"], "a": [0], "e": "The Notebook activity runs a Fabric notebook and can pass parameters to it.", "t": 0}, {"q": "Your organization wants to create a derived stream to route high-priority alerts from a sensor data stream to a custom endpoint for immediate action. What steps should be involved in setting up this configuration?", "o": ["Filter", "Subsequent transformations may produce inaccurate results or errors.", "Filter transformation to isolate high-priority alerts, then configure a derived stream to route alerts to a custom endpoint", "The destination endpoint is incorrectly configured or unreachable"], "a": [2], "e": "High-priority items are isolated via a Filter transformation and then output through a derived stream to a custom endpoint.", "t": 2}, {"q": "Which KQL query returns average Temp per device in 5-minute buckets?", "o": ["T | summarize avg(Temp) by DeviceId, bin(Timestamp, 5m)", "T | project avg(Temp) every 5m", "T | extend bin(5m) | avg(Temp)", "T | where bin(Timestamp, 5m)"], "a": [0], "e": "summarize ... by bin(Timestamp, 5m) creates tumbling time buckets.", "t": 2}, {"q": "You notice that the Real-Time Dashboard displaying bike availability has become cluttered and difficult to navigate. What is the most effective method to reorganize the data for improved clarity and user experience?", "o": ["Organize the dashboard using multiple pages, each dedicated to a specific type of data.", "Use base queries to avoid duplicating logic across tiles", "Organize the dashboard using multiple pages for different types of data.", "Implement a base query to handle the common data retrieval and have each tile query omalies. Which summarization method would best help you identify prolonged high-temperature events?", "o": ["Teams actions", "Average", "Review the rule configuration to ensure the conditions are correctly set to trigger actions at the specified threshold.", "Rules"], "a": [1], "e": "Taking the Average over a rolling time window filters out transient spikes and reliably highlights sustained, prolonged high temperatures.", "t": 2}, {"q": "You added a library to a Fabric Environment, but notebooks still cannot import it. What is the likely cause?", "o": ["V-Order is disabled", "The lakehouse has no schema", "The Environment was not published", "The DefaultReader role is missing"], "a": [2], "e": "Changes to an Environment (libraries, Spark properties) take effect only after you publish it.", "t": 0}]}, {"name": "Practice Test 3", "q": [{"q": "In a type 2 slowly changing dimension, what happens when a dimension attribute changes?", "o": ["MERGE statement to efficiently update and insert product details.", "A new row is added for the updated value, and the previous row is marked as expired.", "A surrogate key is a unique identifier specific to the data warehouse, used for maintaining consistency and accuracy.", "queryinsights.long_running_queries to get ranked execution times."], "a": [1], "e": "SCD Type 2 inserts a new record with the updated attributes while setting the previous record's end date/flag to expired.", "t": 3}, {"q": "You need a 10-minute aggregate recalculated every 2 minutes, so consecutive windows overlap. Which window type?", "o": ["Tumbling", "Hopping", "Session", "Snapshot"], "a": [1], "e": "Hopping windows have a fixed size and advance by a smaller hop, so events fall into several windows.", "t": 2}, {"q": "You have implemented dynamic data masking in your Microsoft Fabric data warehouse, but users are still seeing unmasked data. What could be a reason for this issue?", "o": ["Create a OneLake security role with ReadWrite permission for specified f posure by obscuring sensitive information in real time.", "Dynamic data masking", "The user does not meet any condition in the RLS policy's predicate.", "Column-level security using OneLake security roles"], "a": [3], "e": "Granular access restriction targeting specific columns within a lakehouse table is implemented via OneLake security roles.", "t": 4}, {"q": "Where do you see capacity utilization, throttling, and the top consuming items?", "o": ["Git status panel", "Deployment compare view", "Endorsement settings", "The Capacity Metrics app"], "a": [3], "e": "The Capacity Metrics app is installed by an admin and shows CU consumption, smoothing, and throttling.", "t": 5}, {"q": "What does OPTIMIZE do on a Delta table?", "o": ["Compacts many small files into larger ones", "Deletes old files", "Encrypts data", "Changes the schema"], "a": [0], "e": "OPTIMIZE bin-packs small files to speed reads. VACUUM is the command that removes old files.", "t": 1}, {"q": "Which pipeline expression returns today's UTC date as yyyy-MM-dd text?", "o": ["@today()", "@pipeline().Today", "@formatDateTime(utcnow(),'yyyy-MM-dd')", "@date.now"], "a": [2], "e": "utcnow() returns the current timestamp and formatDateTime formats it.", "t": 0}, {"q": "How can you optimize a Real-Time Dashboard with multiple tiles sharing similar data queries?", "o": ["Use base queries to avoid duplicating logic across tiles", "Organize the dashboard using multiple pages, each dedicated to a specific type of data.", "Parameters", "Correctly configured KQL query"], "a": [0], "e": "Base queries centralize shared data retrieval logic so downstream visual tiles can build on top of a single cached result, reducing query load.", "t": 2}, {"q": "Which of the following best describes the role of OneLake security in Microsoft Fabric?", "o": ["It provides access control within a Fabric item, allowing specification of table or folder access.", "No users or groups will be able to access the specified data despite the role's configuration.", "Create OneLake security roles and restrict access to specific tables containing patient records.", "It determines whether a row is accessible to a user based on certain conditions."], "a": [0], "e": "OneLake security defines fine-grained data-plane access control (tables and folders) within Fabric items.", "t": 4}, {"q": "How can an admin stop a runaway session in a Warehouse?", "o": ["DROP SESSION", "KILL session_id", "ALTER SESSION", "ABORT"], "a": [1], "e": "Find the session in sys.dm_exec_sessions or sys.dm_exec_requests, then KILL it.", "t": 3}, {"q": "If a user needs to execute queries using the SQL analytics endpoint but should not access any data through other engines, which permission configuration is appropriate?", "o": ["Assign compute permissions specific to the SQL analytics endpoint.", "It limits data exposure by obscuring sensitive information in real time.", "Create a OneLake security role with ReadWrite permission for specified folders.", "The user does not have the appropriate OneLake security role assigned."], "a": [0], "e": "Restricting permissions to the SQL analytics endpoint ensures the user can run T-SQL queries while preventing access via Spark, notebooks, or lakehouse APIs.", "t": 4}, {"q": "What does the 'Explain' quick action do in the SQL query editor?", "o": ["To sync content between the workspace and Git, ensuring they have the same content.", "It adds a summary and inline comments to describe the query's functionality.", "By writing comments in your query using -- to describe your intent.", "Investigate the cause by viewing activity details and comparing against historical runs to identify what changed."], "a": [1], "e": "Copilot's Explain action adds descriptive summaries and inline comments explaining the logic without executing the query.", "t": 5}, {"q": "How can Microsoft Fabric Activator help your organization respond to shipment deviations from planned routes?", "o": ["By automatically sending alerts when shipments deviate from their expected paths, enabling quick corrective actions.", "Review the rule configuration to ensure the conditions are correctly set to trigger actions at the specified threshold.", "Threshold monitoring", "Power Automate actions"], "a": [0], "e": "Activator performs real-time continuous rule evaluation on streaming telemetry to alert teams instantly when anomalies occur.", "t": 2}, {"q": "What is the primary function of deployment pipelines in Fabric?", "o": ["By writing comments in your query using -- to describe your intent.", "Deployment pipelines automate the movement of content through the development, test, and production stages.", "Git lets your team collaborate using branches, and provides version control. It helps manage incremental code changes, and see code history.", "To provide a centralized view of recent activity status across a workspace, including the ability to view details and historical runs."], "a": [1], "e": "Fabric deployment pipelines manage Application Lifecycle Management (ALM) by automating content promotion across sequential environment stages.", "t": 5}, {"q": "How can you guide Copilot to generate a specific SQL query in the editor?", "o": ["Investigate the cause by viewing activity details and comparing against historical runs to identify what changed.", "Using descriptive table and column names in your data warehouse.", "By writing comments in your query using -- to describe your intent.", "It generates T-SQL queries and provides intelligent code completions."], "a": [2], "e": "Prefixing instructions with -- in the SQL editor prompts Copilot inline to generate the matching T-SQL code.", "t": 5}, {"q": "How can Eventhouse table data be made available as Delta tables in OneLake for Spark and SQL consumers without building copy pipelines?", "o": ["Create a Dataflow Gen2", "Turn on OneLake availability", "Export with a notebook each night", "Use a Warehouse clone"], "a": [1], "e": "OneLake availability exposes KQL tables as Delta/Parquet in OneLake (verify behavior for your tables).", "t": 0}, {"q": "Which KQL operator expands a dynamic array column into one row per element?", "o": ["bag_unpack", "mv-expand", "parse", "make-series"], "a": [1], "e": "mv-expand flattens multi-value (array) columns. bag_unpack turns a property bag into columns.", "t": 2}, {"q": "Which transformation would be most suitable for ensuring that incoming data streams have consistent naming conventions before being routed to their destination?", "o": ["Custom endpoint", "Manage fields transformation to change data types and rename fields", "Manage fields transformation", "Subsequent transformations may produce inaccurate results or errors."], "a": [2], "e": "Manage fields allows renaming attributes, casting data types, and modifying schema columns for standardization.", "t": 2}, {"q": "What does Git integration store in the repository?", "o": ["The data in tables", "Item definitions (metadata and code), not data", "Capacity settings", "User passwords"], "a": [1], "e": "Only definitions are versioned. A lakehouse, for example, stores its metadata but not its tables or files.", "t": 5}, {"q": "You need to identify long-running queries in your Fabric data warehouse. Which system view would you query to find this information?", "o": ["IntelliSense, code completion, and syntax highlighting", "queryinsights.long_running_queries to get ranked execution times.", "Microsoft Entra ID authentication", "queryinsights.frequently_run_queries"], "a": [1], "e": "The queryinsights.long_running_queries system view exposes queries running longer than 3 minutes, ranked by execution duration.", "t": 3}, {"q": "Which Copilot quick action corrects errors in a T-SQL query in the editor?", "o": ["Explain", "Fix", "Format", "Compare"], "a": [1], "e": "Fix proposes corrected code. Explain adds comments describing what the query does.", "t": 3}, {"q": "Which command shows the operations and versions recorded for a Delta table?", "o": ["SHOW TABLES", "DESCRIBE EXTENDED", "EXPLAIN table_name", "DESCRIBE HISTORY table_name"], "a": [3], "e": "DESCRIBE HISTORY lists commits, operation types, users, and versions.", "t": 1}, {"q": "Which of the following features does the SQL query editor in Microsoft Fabric provide?", "o": ["Azure Data Lake Storage Gen2, Azure Blob Storage, and OneLake lakehouse folders.", "Use indexes on frequently joined columns to speed up query execution.", "Microsoft Entra ID authentication", "IntelliSense, code completion, and syntax highlighting"], "a": [3], "e": "The integrated web SQL query editor features modern development tooling including IntelliSense auto-completion and syntax highlighting.", "t": 3}, {"q": "In a Fabric data warehouse, how can you ensure that changes to customer information over time are captured and queryable?", "o": ["IntelliSense, code completion, and syntax highlighting", "Use slowly changing dimensions to track changes to customer data over time.", "It provides a no-code interface that automatically generates a T-SQL query based on your canvas operations.", "queryinsights.frequently_run_queries"], "a": [1], "e": "Slowly Changing Dimensions (specifically SCD Type 2) maintain historical records with effective date ranges.", "t": 3}, {"q": "While querying a data warehouse, you notice that the query execution time is significantly longer than expected. Which T-SQL feature can you use to optimize the performance of your query?", "o": ["Microsoft Entra ID authentication", "Use indexes on frequently joined columns to speed up query execution.", "IntelliSense, code completion, and syntax highlighting", "queryinsights.frequently_run_queries"], "a": [1], "e": "Indexing join and filter columns optimizes scan paths and accelerates query execution.", "t": 3}, {"q": "What is a KQL queryset used for?", "o": ["Configuring ingestion mappings", "Deploying items to Production", "Running, saving, and sharing KQL queries against data sources", "Creating Delta tables"], "a": [2], "e": "A queryset stores tabs of KQL queries so you can reuse and share them.", "t": 2}, {"q": "What is a recommended way to implement medallion layers in Fabric for governance and security separation?", "o": ["Separate lakehouses per layer, optionally in separate workspaces", "One lakehouse with one folder only", "One warehouse per table", "Only Dataflows"], "a": [0], "e": "Separate items (and workspaces) let you apply different roles, capacity, and lifecycle per layer.", "t": 1}, {"q": "Which update methods can a Dataflow Gen2 use when writing to a Lakehouse table destination?", "o": ["Merge and Upsert", "Append and Replace", "Insert and Delete", "Truncate and Clone"], "a": [1], "e": "Lakehouse destinations support Append (add rows) and Replace (overwrite the table contents).", "t": 0}, {"q": "What is the purpose of a security predicate function in Row-Level Security (RLS)?", "o": ["Create a OneLake security role with ReadWrite permission for specified folders.", "It determines whether a row is accessible to a user based on certain conditions.", "It limits data exposure by obscuring sensitive information in real time.", "The user does not have the appropriate OneLake security role assigned."], "a": [1], "e": "The security predicate is a table-valued function that evaluates row-level visibility criteria against user context.", "t": 4}, {"q": "You must refresh only recently changed rows of a very large source table using Dataflow Gen2. What do you configure?", "o": ["A hopping window", "Shortcut caching", "Incremental refresh keyed on a date/datetime column", "A Z-order index"], "a": [2], "e": "Incremental refresh partitions data by a date/datetime column and reloads only the recent buckets (verify current prerequisites).", "t": 0}, {"q": "Which pipeline activity runs a Dataflow Gen2 as part of an orchestration?", "o": ["Script", "Lookup", "Webhook", "Dataflow"], "a": [3], "e": "The Dataflow activity triggers a Dataflow Gen2 refresh inside a pipeline.", "t": 0}, {"q": "What is the primary advantage of Dynamic Data Masking (DDM)?", "o": ["It determines whether a row is accessible to a user based on certain conditions.", "It limits data exposure by obscuring sensitive information in real time.", "To apply granular permissions for accessing data through the SQL analytics endpoint.", "The user does not meet any condition in the RLS policy's predicate."], "a": [1], "e": "DDM applies real-time obfuscation at query runtime, preventing accidental exposure of sensitive PII/financial data.", "t": 4}, {"q": "Test and Production use different SQL servers. How do you handle this in a deployment pipeline?", "o": ["Configure a data source rule (deployment rule) per stage", "Give each stage a different Git branch only", "Change the workspace role", "Apply a sensitivity label"], "a": [0], "e": "Deployment rules (data source, parameter, default lakehouse) change connections or values per stage.", "t": 5}, {"q": "While setting up an eventstream pipeline, you realize that data is being ingested and stored, but it needs enrichment with additional fields for clarity. Which transformation should you use to add calculated fields to the data?", "o": ["Custom endpoint", "Filter transformation to isolate high-priority alerts, then configure a derived stream to route alerts to a custom endpoint", "The destination endpoint is incorrectly configured or unreachable", "Manage fields transformation"], "a": [3], "e": "Calculated fields and payload enrichment are added using the Manage fields transformation.", "t": 2}, {"q": "Which UI shows running queries and run history, with an option to cancel a query?", "o": ["Git status panel", "Deployment compare view", "Endorsement settings", "Query activity"], "a": [3], "e": "Query activity is the warehouse monitoring page for live and recent queries.", "t": 3}, {"q": "When you select Fabric Warehouse as a destination in Dataflow Gen2, which two update methods are available?", "o": ["Append", "Upsert", "Replace", "Merge"], "a": [0, 2], "e": "Dataflow Gen2 destination settings for Fabric Warehouse offer Append (adding rows) and Replace (truncating and overwriting).", "t": 3}, {"q": "Which type of action in Microsoft Fabric Activator is most suitable for initiating a multi-step process across different systems when a rule condition is met?", "o": ["Threshold monitoring", "Fabric item actions", "Average", "Power Automate actions"], "a": [3], "e": "Power Automate connects to extensive enterprise ecosystems and multi-step connectors across external SaaS and legacy systems.", "t": 2}, {"q": "While setting up a OneLake security role, you forget to define the 'Members' component. What is the consequence of this oversight?", "o": ["The user does not have the appropriate OneLake security role assigned.", "No users or groups will be able to access the specified data despite the role's configuration.", "It determines whether a row is accessible to a user based on certain conditions.", "It limits data exposure by obscuring sensitive information in real time."], "a": [1], "e": "A role without mapped members or security groups is unassigned and inactive; no users receive its permissions.", "t": 4}, {"q": "Which file formats does COPY INTO commonly load into a Fabric warehouse?", "o": ["CSV and Parquet", "XML and Avro", "Excel and PDF", "ORC and Word"], "a": [0], "e": "CSV and Parquet are the core formats (check Microsoft Learn for newer additions such as JSON Lines).", "t": 3}, {"q": "Your organization needs to integrate real-time event data with an external system for custom processing. Which eventstream destination should be configured?", "o": ["Manage fields transformation to change data types and rename fields", "Custom endpoint", "The destination endpoint is incorrectly configured or unreachable", "Join"], "a": [1], "e": "Custom endpoints expose streaming data to third-party or custom external processing applications.", "t": 2}, {"q": "When designing a data warehouse using dimensional modeling in Microsoft Fabric, which of the following statements best describes the role of a surrogate key in dimension tables?", "o": ["A surrogate key is a unique identifier specific to the data warehouse, used for maintaining consistency and accuracy.", "A new row is added for the updated value, and the previous row is marked as expired.", "Use indexes on frequently joined columns to speed up query execution.", "It provides a no-code interface that automatically generates a T-SQL query based on your canvas operations."], "a": [0], "e": "Surrogate keys are warehouse-managed primary keys that isolate the warehouse from upstream source key mutations and support SCD Type 2 tracking.", "t": 3}, {"q": "A workspace item and its Git version have diverged and you see a conflict. What do you do?", "o": ["Delete the workspace", "Wait 24 hours", "Let Fabric always merge automatically", "Resolve it in source control by choosing the Git version or the workspace version"], "a": [3], "e": "Conflicts are resolved by accepting the incoming Git change or keeping the workspace version.", "t": 5}, {"q": "Which operation performs an upsert into a Delta table?", "o": ["COPY", "VACUUM", "CLONE", "MERGE"], "a": [3], "e": "MERGE updates matching rows and inserts new ones in one atomic operation (Delta Lake DeltaTable.merge or SQL MERGE INTO).", "t": 1}, {"q": "What is the default collation behavior of a new Fabric Warehouse?", "o": ["Case-insensitive", "Case-sensitive (Latin1_General_100_BIN2_UTF8)", "EBCDIC", "It depends on region"], "a": [1], "e": "The default is case-sensitive. You can choose a case-insensitive collation when creating the warehouse (verify current options).", "t": 3}, {"q": "A pipeline should start whenever a new file lands in Azure Blob Storage. What is the best trigger?", "o": ["A storage event trigger through Activator", "A schedule running every second", "A manual run", "A Dataflow refresh"], "a": [0], "e": "Event-based triggers (Azure Blob and OneLake events) start the pipeline when files are created, without polling.", "t": 0}, {"q": "In an eventstream pipeline, you notice that the transformation process is complete, but the data fails to reach any destination. What could be a potential cause of this issue?", "o": ["Use a Filter transformation to remove invalid data, then route to Fabric Activator for high-temperature alerts", "Manage fields transformation to change data types and rename fields", "The destination endpoint is incorrectly configured or unreachable", "Filter"], "a": [2], "e": "If transformations execute successfully, failure to land in the sink points to destination misconfiguration, connectivity errors, or network/credential issues.", "t": 2}, {"q": "An application you own must push events into Fabric by using an SDK. Which eventstream source fits?", "o": ["Azure Blob Storage events", "Sample data", "Database CDC", "Custom endpoint"], "a": [3], "e": "A custom endpoint source gives your app an Event Hubs-, Kafka-, or AMQP-compatible endpoint and connection string.", "t": 2}]}, {"name": "Practice Test 4", "q": [{"q": "Which action available in Activator enables automated remediation of a Fabric job failure — not just notification?", "o": ["Rules", "Average", "Run a Fabric activity.", "Fabric item actions"], "a": [2], "e": "Running a Fabric activity/pipeline triggers automated corrective remediation workflows rather than passive notification.", "t": 2}, {"q": "You want to monitor capacity unit consumption in your Fabric data warehouse. What tools should you use?", "o": ["Microsoft Fabric Capacity Metrics app", "Deployment pipelines automate the movement of content through the development, test, and production stages.", "It generates T-SQL queries and provides intelligent code completions.", "It adds a summary and inline comments to describe the query's functionality."], "a": [0], "e": "The Fabric Capacity Metrics app is the dedicated tool for monitoring Capacity Unit (CU) consumption, throttling, and workload breakdown.", "t": 5}, {"q": "You are tasked with designing a Real-Time Dashboard that effectively displays bike rental data for operational decisions. Which method should you use to organize the dashboard to allow easy navigation between different types of data?", "o": ["By consolidating shared logic into a single query that multiple tiles can reference.", "Interactive parameters for neighborhood-specific filtering.", "Use base queries to avoid duplicating logic across tiles", "Organize the dashboard using multiple pages, each dedicated to a specific type of data."], "a": [3], "e": "Creating dedicated pages for distinct operational focus areas ensures clean navigation and user comprehension.", "t": 2}, {"q": "Why is it recommended to remove a user from the DefaultReader role when adding them to a custom OneLake security role?", "o": ["Create a OneLake security role with ReadWrite permission for specified folders.", "Create OneLake security roles and restrict access to specific tables containing patient records.", "To prevent them from retaining full read access through the default role, which might conflict with custom access settings.", "It provides access control within a Fabric item, allowing specification of table or folder access."], "a": [2], "e": "OneLake permissions are additive; leaving a user in DefaultReader grants broad read access that bypasses custom restrictions.", "t": 4}, {"q": "Your company wants to add interactive filtering to the Real-Time Dashboard for bike availability data. What feature should you use to achieve this?", "o": ["Organize the dashboard using multiple pages, each dedicated to a specific type of data.", "Interactive parameters for neighborhood-specific filtering.", "Parameters", "To avoid duplicating logic across multiple tiles and ensure consistent data retrieval."], "a": [2], "e": "Parameters provide dashboard controls that allow viewers to filter and slice data interactively.", "t": 2}, {"q": "A workspace must read a firewall-protected ADLS Gen2 account without opening it to the public internet. What do you configure?", "o": ["A shared access key in the notebook", "A public IP allow-list for all of Azure", "Trusted workspace access using the workspace identity (verify capacity SKU requirements)", "A bigger Spark pool"], "a": [2], "e": "Workspace identity with trusted workspace access, or a managed private endpoint for Spark, avoids public exposure.", "t": 4}, {"q": "Approximately how long does the Fabric Monitor hub retain activity history?", "o": ["7 days", "30 days", "90 days", "1 year"], "a": [1], "e": "Monitor hub keeps about 30 days of history (verify). For longer retention use workspace monitoring or Log Analytics.", "t": 5}, {"q": "Your organization needs to standardize the format of incoming data from multiple sources before combining them into a single stream. Which transformation should be used to ensure consistent data structure?", "o": ["Use a Filter transformation to remove invalid data, then route to Fabric Activator for high-temperature alerts", "Filter", "Custom endpoint", "Manage fields transformation"], "a": [3], "e": "Reshaping, aligning schemas, and casting columns from disparate streams prior to merging is accomplished using Manage fields.", "t": 2}, {"q": "What is the role of Git in the CI/CD process in Fabric?", "o": ["By writing comments in your query using -- to describe your intent.", "To sync content between the workspace and Git, ensuring they have the same content.", "Deployment pipelines automate the movement of content through the development, test, and production stages.", "Git lets your team collaborate using branches, and provides version control. It helps manage incremental code changes, and see code history."], "a": [3], "e": "Git delivers source code version control, branch management, collaboration, and history tracking for Fabric items.", "t": 5}, {"q": "Your organization uses Microsoft Fabric to monitor real-time data from various sources. You notice that similar logic is being written repeatedly across different tiles. How can base queries improve this situation?", "o": ["Organize the dashboard using multiple pages for different types of data.", "By consolidating shared logic into a single query that multiple tiles can reference.", "Correctly configured KQL query", "Implement a base query to handle the common data retrieval and have each tile query reference it."], "a": [1], "e": "Base queries eliminate duplicate KQL code by consolidating common data retrieval steps into a single query referenced by visual tiles.", "t": 2}, {"q": "Which magic command runs Spark SQL in a notebook cell?", "o": ["%%sql", "%%kql", "%%tsql", "%%dax"], "a": [0], "e": "%%sql runs Spark SQL against lakehouse tables in the attached lakehouse.", "t": 1}, {"q": "Which dynamic management view provides details about SQL commands running in the data warehouse?", "o": ["IntelliSense, code completion, and syntax highlighting", "MERGE statement to efficiently update and insert product details.", "sys.dm_exec_requests", "queryinsights.long_running_queries to get ranked execution times."], "a": [2], "e": "sys.dm_exec_requests returns real-time diagnostic information on active requests and executing SQL queries.", "t": 3}, {"q": "To enhance the Real-Time Dashboard's ability to display bike availability data specific to neighborhoods, which feature should be implemented?", "o": ["Use base queries to avoid duplicating logic across tiles", "Interactive parameters for neighborhood-specific filtering.", "Organize the dashboard using multiple pages for different types of data.", "Implement a base query to handle the common data retrieval and have each tile query reference it."], "a": [1], "e": "Parameters allow dynamic user-driven filtering (e.g., dropdown selection of neighborhoods) across multiple tiles without tile duplication.", "t": 2}, {"q": "What is the primary purpose of the monitoring hub in Microsoft Fabric?", "o": ["By writing comments in your query using -- to describe your intent.", "Investigate the cause by viewing activity details and comparing against historical runs to identify what changed.", "Using descriptive table and column names in your data warehouse.", "To provide a centralized view of recent activity status across a workspace, including the ability to view details and historical runs."], "a": [3], "e": "The Monitoring hub centralizes tracking and troubleshooting of all background and interactive job executions across workspaces.", "t": 5}, {"q": "During a system review, you notice that Microsoft Fabric Activator is not sending alerts for temperature readings above the safe threshold. What initial action should be taken to resolve this?", "o": ["Average", "Review the rule configuration to ensure the conditions are correctly set to trigger actions at the specified threshold.", "Rules", "Power Automate actions"], "a": [1], "e": "The primary troubleshooting step for missing alerts is validating trigger rule thresholds, comparison logic, and property mappings.", "t": 2}, {"q": "How does a notebook return a value to the calling pipeline?", "o": ["print(value)", "df.show()", "Write it to the Spark log", "notebookutils.notebook.exit(value), read via the activity output result.exitValue"], "a": [3], "e": "The exit value is exposed in the Notebook activity's output and can be used in later expressions.", "t": 0}, {"q": "Raw events landing in an Eventhouse table must be transformed into a curated table automatically as they arrive. Which feature?", "o": ["Update policy", "Retention policy", "Row-level security", "Shortcut"], "a": [0], "e": "An update policy runs a KQL function on newly ingested data and writes the result to a target table.", "t": 2}, {"q": "You must update two warehouse tables so that both succeed or both fail. What do you use?", "o": ["BEGIN TRANSACTION ... COMMIT", "Not possible in Fabric", "A Spark notebook", "A shortcut"], "a": [0], "e": "Warehouses support multi-table transactions.", "t": 3}, {"q": "In Activator, what represents the business entity you track, such as a package or a vehicle?", "o": ["Workspace", "Capacity", "Object, identified by an ID column", "Domain"], "a": [2], "e": "Activator models entities as objects with properties and rules, keyed by an ID in the incoming data.", "t": 2}, {"q": "Which isolation level do Fabric Warehouse transactions use?", "o": ["Read uncommitted", "Serializable", "Snapshot isolation", "Repeatable read"], "a": [2], "e": "Snapshot isolation is used, so conflicting writers can abort and should retry.", "t": 3}, {"q": "What data sources does the COPY (Transact-SQL) statement support for loading files into a Fabric warehouse?", "o": ["MERGE statement to efficiently update and insert product details.", "Azure Data Lake Storage Gen2, Azure Blob Storage, and OneLake lakehouse folders.", "It provides a no-code interface that automatically generates a T-SQL query based on your canvas operations.", "Use slowly changing dimensions to track changes to customer data over time."], "a": [1], "e": "The T-SQL COPY INTO command natively supports ingesting Parquet/CSV files from external ADLS Gen2, Azure Blob Storage, and internal OneLake paths.", "t": 3}, {"q": "What is the default file retention period for VACUUM on a Delta table?", "o": ["24 hours", "30 days", "7 days (168 hours)", "365 days"], "a": [2], "e": "Files older than the retention period and no longer referenced are removed. Shortening it limits time travel.", "t": 1}, {"q": "Which best practice improves Copilot's ability to generate accurate SQL queries?", "o": ["Investigate the cause by viewing activity details and comparing against historical runs to identify what changed.", "Using descriptive table and column names in your data warehouse.", "To sync content between the workspace and Git, ensuring they have the same content.", "It generates T-SQL queries and provides intelligent code completions."], "a": [1], "e": "Clear, descriptive schema identifiers give Copilot the semantic context required to produce accurate SQL code.", "t": 5}]}, {"name": "Practice Test 5", "q": [{"q": "Your organization uses Microsoft Fabric for managing data pipelines in a large-scale ETL process. The setup involves multiple pipelines that must handle different datasets dynamically, reducing hardcoding and improving maintainability.<br>You need to reuse pipeline components with varying inputs during execution.<br>Which two settings should you configure? Each correct answer presents part of the solution.", "o": ["Hardcode dataset paths.", "Pass external values as parameters.", "Use fixed dataset configurations.", "Use string interpolation."], "a": [1, 3], "e": "Hardcoding dataset paths does not support dynamic execution and requires manual changes for each dataset, which is inefficient. Using string interpolation is effective as it allows the construction of dynamic expressions by incorporating parameter values, facilitating the handling of various datasets. Passing external values as parameters is crucial for dynamic execution, as it enables the pipeline to adapt to different datasets without hardcoding. Fixed dataset configurations are unsuitable because they lack the flexibility needed for runtime changes, failing to meet the dynamic requirements of the scenario.", "t": 0}, {"q": "You have a Fabric workspace named Workspace1 that contains an Apache Spark pool.<br>You plan to create a notebook named Notebook1 in Workspace1.<br>You need to ensure that Notebook1 uses high concurrency mode so that Spark sessions can be shared across multiple concurrent users or processes.<br>Which Workspace settings should you configure?", "o": ["Data Engineering/Science &amp;gt; Spark Settings", "Data Factory", "Data Warehouse", "Delegated Settings"], "a": [0], "e": "High concurrency for Spark is controlled via Data Engineering/Science Settings; other settings are unrelated.", "t": 0}, {"q": "Your organization uses Microsoft Fabric for managing data pipelines in a large-scale ETL process. The current setup involves multiple pipelines triggered by specific events and schedules, facing challenges with hard-coded values.<br>You need to implement dynamic parameterization to enhance flexibility and reduce maintenance.<br>Which two settings should you configure? Each correct answer presents part of the solution.", "o": ["Hard-code values in the configuration.", "Pass external values using pipeline parameters.", "Use dynamic expressions for runtime evaluation.", "Use static triggers for pipeline execution.", "Use static values in expressions."], "a": [1, 2], "e": "Hard-coding values in the configuration contradicts the goal of reducing maintenance overhead and increasing flexibility. Using dynamic expressions for runtime evaluation allows parameter values to be evaluated at runtime, providing the flexibility needed to adapt to different scenarios without changing the pipeline code. Using static values in expressions does not provide the flexibility needed for dynamic parameterization. Using static triggers for pipeline execution does not provide the flexibility required for dynamic parameterization. Passing external values using pipeline parameters allows you to pass external values into the pipelines, making them more flexible and reducing the need for hard-coded values.", "t": 0}, {"q": "Your organization uses Microsoft Fabric to manage a data warehouse that contains sensitive customer information.<br>You need to prevent nonprivileged users from viewing full email addresses and credit card numbers.<br>Which two actions should you perform? Each correct answer presents part of the solution.", "o": ["Apply column-level security to restrict access to sensitive columns.", "Implement row-level security to restrict access to sensitive data.", "Use dynamic data masking on CreditCardNumber with partial() function.", "Use dynamic data masking on Email with email() function."], "a": [2, 3], "e": "Implementing dynamic data masking on the Email and CreditCardNumber columns ensures that nonprivileged users can access the data without seeing sensitive information. Row-level security controls access to specific rows, which might seem like a way to protect sensitive data but does not mask it.", "t": 3}, {"q": "You have an Azure Event Hubs namespace that receives high-volume IoT telemetry.<br>Yiu have a Fabric workspace that contains a Real-Time Intelligence eventhouse and a KQL database.<br>Raw events must be retained unchanged for audit, while analytics requires a normalized schema with derived columns.<br>You need to transform the data after it lands in the KQL database, while keeping the raw data available.<br>What should you do?", "o": ["Create an eventstream, configure a derived stream for transformations, and use the derived stream as the only destination.", "Create an eventstream, apply transformations in the eventstream, and route only the transformed output to the KQL database.", "Ingest data from the namespace directly into a KQL database table, and use KQL update policies to populate a transformed table.", "Ingest data into a lakehouse table, and use Apache Spark Structured Streaming to write the transformed data to the KQL database."], "a": [2], "e": "Ingesting raw events directly into a KQL table preserves the original data. KQL update policies can automatically populate another table with transformed or normalized data when new records arrive. This pattern keeps the raw dataset for audit, while creating a curated dataset for analytics. Transforming in an eventstream modifies the data before ingestion and does not retain the raw events in the KQL database. Using Spark Structured Streaming through a lakehouse introduces an unnecessary intermediate store and does not meet the requirement to transform data after ingestion into the KQL database. Using a derived stream as the only destination also prevents the raw events from being retained unchanged.", "t": 2}, {"q": "Your company uses Microsoft Fabric Lakehouse to manage large datasets for analytics.<br>Recently, query performance on a Delta table has degraded due to an increase in small Parquet files.<br>You need to optimize the Delta table to improve query efficiency.<br>Which two actions should you perform? Each correct answer presents part of the solution.", "o": ["Apply V-Order for better data sorting and compression.", "Convert to Hive table format.", "Increase the number of partitions in the Delta table.", "Use the OPTIMIZE command to consolidate files."], "a": [0, 3], "e": "Applying V-Order optimizes sorting, encoding, and compression, enhancing read operations and overall query performance. The Optimize command consolidates multiple small Parquet files into larger ones, improving query performance by reducing the number of files that need to be scanned. Converting to a Hive table format is not supported for Delta tables in Lakehouse and would not improve performance. Increasing the number of partitions might seem beneficial but can lead to increased overhead and slower query times if not managed properly.", "t": 1}, {"q": "Your organization is implementing a real-time analytics solution using Microsoft Fabric to process streaming data from IoT devices.<br>You need to configure a job to ingest streaming data into a table for near real-time querying.<br>Which three actions should you perform? Each correct answer presents part of the solution.", "o": ["Create a Spark Job Definition with a Python script for Structured Streaming.", "Set the checkpoint location in the streaming job.", "Store data in a JSON file for later analysis.", "Use batch processing to ingest data into the lakehouse.", "Use Delta table as a sink for streaming data."], "a": [0, 1, 4], "e": "Creating a Microsoft Spark Job Definition with a Python script using Microsoft Spark Structured Streaming is essential for processing streaming data and writing it to a Microsoft Delta table. Using the Microsoft Delta table as a sink allows the streaming data to be stored in a structured format, enabling efficient querying and analysis. Setting the checkpoint location is crucial for maintaining the state of the stream processing and ensuring fault tolerance. Batch processing is not suitable for real-time data ingestion as it does not support continuous data flow. Storing data in a JSON file does not support real-time querying and lacks the transactional capabilities of a Microsoft Delta table.", "t": 2}, {"q": "You have a Fabric workspace named Sales-Dev that is connected to an Azure DevOps Git repository. The workspace contains a notebook and a lakehouse.<br>A recent notebook change breaks an orchestration process. A previous working version exists in the Git commit history.<br>You need to restore the workspace items to a previous committed version from the Git repository.<br>What should you do?", "o": ["Use undo in the notebook in the Fabric workspace, and then commit the changes to Git.", "Create a deployment pipeline and redeploy the items from the Development stage to the Test stage.", "Copy the item directory in the Git repository, change the logicalId and display name, and then sync the workspace.", "Use git revert or git reset in the Git repository to restore the repository to a previous commit, and then sync the workspace from source control."], "a": [3], "e": "Restoring a previous version requires reverting or resetting the Git repository to an earlier commit and then syncing the workspace from source control; Using undo in the workspace does not restore version-controlled history; Deployment pipelines are used for promotion across environments, not rollback; Manually modifying repository files and identifiers is not a supported or reliable recovery method.", "t": 5}, {"q": "You have a Fabric data warehouse named Warehouse1.<br>You need to create a database project for Warehouse1 in Microsoft Visual Studio Code. The solution must allow you to later modify the schema of Warehouse1 from within Visual Studio Code. The solution must NOT affect the existing schema of Warehouse1 when the project is created.<br>What should you do first?", "o": ["Add a connection to DB1, right-click the connection, and select Manage Packages.", "Add a connection to Warehouse1, right-click the connection, and select Create Project From Database.", "Add a connection to warehouse1, right-click the connection, and select New Query.", "From the Command Palette, run Create Database Project From Scratch."], "a": [1], "e": "Creating a project from the connected database imports schema into a project without altering the database; other actions either don’t create a project or don’t import existing schema.", "t": 3}, {"q": "Your organization uses Microsoft Fabric to manage data engineering tasks. The current setup includes a starter pool for Apache Spark jobs.<br>You notice that some jobs require more compute resources than the starter pool can provide.<br>You need to optimize the workspace configuration to efficiently handle larger Spark jobs without significantly increasing session start times.<br>Which two actions should you perform? Each correct answer presents part of the solution.", "o": ["Create a custom Spark pool with autoscaling.", "Disable the starter pool.", "Enable dynamic allocation of executors.", "Increase executor memory in the starter pool.", "Increase the number of partitions in the Spark job."], "a": [0, 2], "e": "Creating a custom Spark pool with autoscaling allows for specifying node sizes and enabling dynamic resource allocation, which is essential for handling larger Spark jobs. Enabling dynamic allocation of executors further optimizes resource usage by adjusting the number of executors based on workload demands. Disabling the starter pool without a custom pool reduces available resources, while increasing executor memory in the starter pool lacks the dynamic aspect needed for efficient resource management. Increasing the number of partitions does not address the core issue of managing larger Spark jobs.", "t": 1}, {"q": "Your company experiences performance issues with its current ETL process, which involves loading large volumes of sales data into a fact table in a Microsoft Fabric data warehouse. The process currently uses a full reload strategy, which is time-consuming and resource-intensive.<br>You need to enhance the ETL process to boost performance and decrease resource usage.<br>Which two actions should you perform? Each correct answer presents part of the solution.", "o": ["Continue full reloads with increased compute resources.", "Implement an incremental load strategy.", "Manually partition the fact table.", "Switch to Azure Data Factory for ETL.", "Use Change Data Capture (CDC) for tracking changes."], "a": [1, 4], "e": "Implementing an incremental load strategy is effective because it reduces the amount of data processed during each ETL run, improving performance and reducing resource usage. Using Change Data Capture (CDC) for tracking changes is also beneficial as it allows tracking of changes in the source system, enabling efficient incremental loading of only the modified data into the fact table. Continuing full reloads with increased compute resources may temporarily alleviate performance issues but does not address the inefficiencies of a full reload strategy. Manually partitioning the fact table can improve query performance but does not directly address the inefficiencies in the ETL process itself. Switching to Azure Data Factory for ETL without addressing the full reload strategy may not improve performance.", "t": 3}, {"q": "Your organization uses Microsoft Fabric for data warehouse management. The security team is concerned about unauthorized access to sensitive customer information in a database.<br>You need to ensure sensitive data is protected and accessible only to authorized users.<br>Which three actions should you perform? Each correct answer presents part of the solution.", "o": ["
