<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fabric DP-700 Practice Tests</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2030;--mu:#667;--bd:#d9dde8;--ac:#2b59d9;--ok:#d9f5e0;--okb:#1f9d46;--no:#fde0e0;--nob:#d33c3c}
@media(prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1b2030;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#2f3649;--ac:#6c8cff;--ok:#143a22;--okb:#3ccf6e;--no:#43191b;--nob:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
.w{max-width:820px;margin:0 auto;padding:24px 16px}h1{font-size:26px;margin:0 0 4px}.mu{color:var(--mu)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:20px}
.set{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.set:hover{border-color:var(--ac)}.set b{font-size:18px;display:block}.best{margin-top:8px;font-size:14px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-top:16px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:10px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.tag{font-size:12px;background:var(--bd);border-radius:10px;padding:2px 9px;margin-left:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--bd);border-radius:10px;padding:11px 13px;margin:9px 0;cursor:pointer}
.opt input{margin-top:5px}.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.no{background:var(--no);border-color:var(--nob)}
.opt.lock{cursor:default}.exp{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:4px solid}.exp.ok{background:var(--ok);border-color:var(--okb)}.exp.no{background:var(--no);border-color:var(--nob)}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}button.b{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:10px 20px;font:inherit;cursor:pointer}
button.b.g{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}button.b:disabled{opacity:.45;cursor:not-allowed}
.big{font-size:56px;font-weight:700;text-align:center;margin:10px 0}.msg{color:var(--nob);font-size:14px;margin-top:8px;min-height:20px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left}.pc{font-weight:600}.hm{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:8px 16px}.top2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
.res{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.pf{display:inline-block;font-weight:700;border-radius:8px;padding:5px 14px;font-size:15px}.pf.ok{background:var(--ok);color:var(--okb);border:1.5px solid var(--okb)}.pf.no{background:var(--no);color:var(--nob);border:1.5px solid var(--nob)}
.kgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}.kpi{border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.kv{font-size:26px;font-weight:700}.ks{font-size:12px}.kc{grid-column:1/-1}
@media(min-width:720px){.kc{grid-column:span 2}}</style></head><body><div class="w" id="app"></div><script>
const DATA=[{"name": "Practice Test 1", "q": [{"q": "During a review of your eventstream pipeline, you discover that IoT sensor data is not being enriched with calculated priority fields. Which transformation step should be implemented to resolve this issue?", "o": ["Custom endpoint", "Use a Filter transformation to remove invalid data, then route to Fabric Activator for high-temperature alerts", "Manage fields transformation to change data types and rename fields", "Manage fields transformation"], "a": [3], "e": "Adding derived or calculated fields to event payloads is handled via the Manage fields transformation."}, {"q": "Which Dataflow Gen2 capability is designed for high-throughput ingestion of large volumes with little or no transformation?", "o": ["Fast copy", "Data wrangler", "Query parameters", "Z-order"], "a": [0], "e": "Fast copy uses the Copy engine for large loads. It falls back to the standard engine if its conditions are not met."}, {"q": "You append a DataFrame with an extra column to a Delta table and the write fails. Why, and how do you allow the new column?", "o": ["A V-Order conflict; disable V-Order", "Schema enforcement; use option('mergeSchema','true')", "The table is a shortcut; delete it", "Retention; run VACUUM"], "a": [1], "e": "Delta rejects writes that do not match the schema unless schema evolution is enabled with mergeSchema."}, {"q": "Where should you land raw CSV, JSON, or image files in a lakehouse?", "o": ["Tables", "Files", "Shortcuts only", "The SQL endpoint"], "a": [1], "e": "Files accepts any format, which suits bronze landing zones."}, {"q": "Which string operator is generally faster than the others for term searches on a large KQL table?", "o": ["contains", "matches regex", "has", "search *"], "a": [2], "e": "has uses the term index. contains is a substring scan, and == is fastest for exact matches."}, {"q": "A Dataflow Gen2 with heavy transformations over a large dataset runs slowly in the mashup engine. Which setting offloads work to SQL compute on staged data?", "o": ["Disable query folding", "Switch to Import mode", "Enable high concurrency", "Enable staging"], "a": [3], "e": "With staging enabled, data lands in a staging item and transformations run on SQL compute, which usually speeds up heavy, non-folding work."}, {"q": "Where does Fabric store all workload data, and in which open format do lakehouse tables default?", "o": ["OneLake, Delta (Parquet plus a transaction log)", "Azure SQL, CSV", "A separate store per workload, ORC", "OneDrive, JSON"], "a": [0], "e": "OneLake is the single logical lake ('OneDrive for data'), and tables are Delta format."}, {"q": "What is the main benefit of high concurrency mode for notebooks?", "o": ["It enables V-Order automatically", "Several notebooks share one Spark session, cutting start time and cost", "It adds nodes beyond capacity", "It disables autoscale"], "a": [1], "e": "Notebooks with matching user, workspace, default lakehouse, and configuration can share a session."}, {"q": "What is the fastest way to ingest a one-off CSV file into a KQL table?", "o": ["Write a Spark streaming job", "Create a deployment pipeline", "Use a Warehouse COPY INTO", "Get data in the KQL database (one-click ingestion)"], "a": [3], "e": "The Get data experience infers the schema and creates the table and mapping for you."}, {"q": "Which feature stores historical query information in system views so you can analyze past queries?", "o": ["Query insights (the queryinsights schema)", "sys.tables", "INFORMATION_SCHEMA.COLUMNS", "Only the live DMVs"], "a": [0], "e": "Query insights keeps history such as exec_requests_history, long_running_queries, and frequently_run_queries."}, {"q": "Which workspace roles are not restricted by OneLake data access roles?", "o": ["Admin, Member, and Contributor", "Viewer only", "Only users with ReadData", "Nobody, everyone is restricted"], "a": [0], "e": "Admin, Member, and Contributor always have full access. OneLake data access roles govern Viewers and users shared with ReadAll."}, {"q": "In designing a data pipeline using the eventstream canvas, your task is to ensure that IoT sensor data is processed to remove invalid data and then routed for high-temperature alerts. What series of transformations and destinations should you configure?", "o": ["Use a Filter transformation to remove invalid data, then route to Fabric Activator for high-temperature alerts", "The destination endpoint is incorrectly configured or unreachable", "Custom endpoint", "Manage fields transformation"], "a": [0], "e": "A Filter transformation purges invalid readings, and the high-temperature alert condition routes to Fabric Activator for automated alerting."}, {"q": "You need a test copy of a large table without duplicating the data. What do you use?", "o": ["CTAS", "Zero-copy clone (CREATE TABLE ... AS CLONE OF)", "COPY INTO", "An export to CSV"], "a": [1], "e": "Clones reference the same underlying files, so they are fast and cheap."}, {"q": "Which command lists failed ingestions in a KQL database?", "o": [".show queries", ".show ingestion failures", ".show tables", ".show cache"], "a": [1], "e": "It shows failure reasons such as mapping errors or malformed records."}, {"q": "Which layer typically serves Power BI via a Direct Lake semantic model?", "o": ["Bronze", "Gold", "Landing Files only", "Environment"], "a": [1], "e": "Gold has business-ready aggregates or a star schema. Direct Lake reads the Delta files directly, falling back to DirectQuery if limits are exceeded."}, {"q": "A dataflow that usually finishes in 4 minutes suddenly takes 20 minutes but still shows a Succeeded status. What should you do?", "o": ["To provide a centralized view of recent activity status across a workspace, including the ability to view details and historical runs.", "It adds a summary and inline comments to describe the query's functionality.", "Investigate the cause by viewing activity details and comparing against historical runs to identify what changed.", "Deployment pipelines automate the movement of content through the development, test, and production stages."], "a": [2], "e": "Comparing execution metrics against historical baselines in the activity details allows diagnosis of performance regressions before failures occur."}, {"q": "Your company requires frequent updates to the DimProduct table to reflect changing product details. Which T-SQL statement ensures that updates are performed efficiently without duplicating existing records?", "o": ["Use slowly changing dimensions to track changes to customer data over time.", "MERGE statement to efficiently update and insert product details.", "Azure Data Lake Storage Gen2, Azure Blob Storage, and OneLake lakehouse folders.", "IntelliSense, code completion, and syntax highlighting"], "a": [1], "e": "The T-SQL MERGE statement atomically combines UPDATE and INSERT (upsert) logic based on key matching in a single optimized command."}, {"q": "How do you source-control and deploy a Warehouse schema with a database project?", "o": ["Build a .pbix file", "Package a .whl", "Build a .dacpac and publish it with SqlPackage", "Export CSV files"], "a": [2], "e": "A SQL database project builds to a .dacpac. SqlPackage computes the differences and applies them to the target."}, {"q": "What T-SQL pattern creates a new table from the results of a query across multiple warehouses in the same workspace?", "o": ["MERGE statement to efficiently update and insert product details.", "CREATE TABLE AS SELECT (CTAS)", "Microsoft Entra ID authentication", "sys.dm_exec_requests"], "a": [1], "e": "CREATE TABLE AS SELECT (CTAS) evaluates a query across warehouses using cross-database naming and writes the result into a new table in one parallelized operation."}, {"q": "A financial institution wants to flag unusual transaction patterns for immediate review using Microsoft Fabric Activator. Which type of action should they configure to ensure quick team coordination?", "o": ["Review the rule configuration to ensure the conditions are correctly set to trigger actions at the specified threshold.", "Rules", "By automatically sending alerts when shipments deviate from their expected paths, enabling quick corrective actions.", "Teams actions"], "a": [3], "e": "Microsoft Teams actions deliver contextual alert cards into team channels or chats for rapid human review and collaborative response."}, {"q": "Which Eventhouse policy keeps recent data on fast storage for quick queries?", "o": ["Retention", "Update", "Ingestion batching", "Caching (hot cache)"], "a": [3], "e": "The caching policy defines how much recent data stays hot. Retention controls when data is deleted."}, {"q": "Which item supports T-SQL INSERT, UPDATE, and DELETE?", "o": ["Lakehouse SQL analytics endpoint", "Warehouse", "Eventhouse", "Mirrored database endpoint"], "a": [1], "e": "A Warehouse is a full read/write T-SQL engine. The other endpoints are read-only for T-SQL."}, {"q": "Which view should you use to identify commonly run commands in your data warehouse?", "o": ["queryinsights.long_running_queries to get ranked execution times.", "Incremental load", "IntelliSense, code completion, and syntax highlighting", "queryinsights.frequently_run_queries"], "a": [3], "e": "The queryinsights.frequently_run_queries view aggregates historical execution counts to spotlight repetitive workloads."}, {"q": "Which Git providers can a Fabric workspace connect to?", "o": ["Bitbucket and GitLab", "Azure DevOps and GitHub", "SVN and Perforce", "Only OneDrive"], "a": [1], "e": "Fabric Git integration supports Azure DevOps and GitHub (cloud)."}, {"q": "In a star schema load, what is the correct order?", "o": ["Facts first", "Dimensions first, then facts", "Both in parallel with no ordering", "Date dimension last"], "a": [1], "e": "Facts look up dimension surrogate keys, so dimensions must be loaded first."}, {"q": "Your organization uses Microsoft Fabric to manage healthcare data. Team members need access to specific patient records but should not have access to insurance claims or clinical trial data. Which approach should you take to ensure the team members have the correct access within OneLake?", "o": ["Create a OneLake security role with ReadWrite permission for specified folders.", "Create OneLake security roles and restrict access to specific tables containing patient records.", "To apply granular permissions for accessing data through the SQL analytics endpoint.", "The user does not have the appropriate OneLake security role assigned."], "a": [1], "e": "OneLake security roles enable granular, table-level data access control within a lakehouse."}, {"q": "How do you return the latest reading per device in KQL?", "o": ["top 1 by Timestamp", "distinct DeviceId", "summarize arg_max(Timestamp, *) by DeviceId", "take 1"], "a": [2], "e": "arg_max returns the row with the maximum timestamp for each key. It is also the standard KQL deduplication pattern."}, {"q": "What happens when a user is granted a permission and then denied the same permission in a warehouse?", "o": ["Create a OneLake security role with ReadWrite permission for specified folders.", "To apply granular permissions for accessing data through the SQL analytics endpoint.", "The DENY always supersedes the GRANT, and the user is denied access to the specific object.", "It determines whether a row is accessible to a user based on certain conditions."], "a": [2], "e": "Under SQL permission precedence rules, an explicit DENY takes precedence over any GRANT."}, {"q": "What is the fastest UI action to turn a CSV in Files into a Delta table?", "o": ["Run VACUUM", "Create a dataflow only", "Create a deployment rule", "Load to Tables"], "a": [3], "e": "Load to Tables converts supported files (such as CSV and Parquet) into a Delta table."}, {"q": "How can you confirm that a Power Query step is being pushed down to the data source?", "o": ["Check the Spark UI", "Right-click the step and see whether View data source query (native query) is available", "Run OPTIMIZE", "Open the Capacity Metrics app"], "a": [1], "e": "If the native query option is enabled, the step folds to the source. A greyed-out option means folding stopped at or before that step."}, {"q": "What does Branch out to new workspace do?", "o": ["Deletes the main branch", "Copies data to a new capacity", "Creates an isolated workspace connected to a new feature branch", "Promotes content to Production"], "a": [2], "e": "It gives each developer an isolated workspace for a feature branch, merged later through a pull request."}, {"q": "Which KQL function detects anomalies in a series created with make-series?", "o": ["series_decompose_anomalies", "bin_at", "arg_min", "row_number"], "a": [0], "e": "It decomposes the series (trend, seasonality, residual) and flags outliers."}, {"q": "What does a deployment pipeline copy between stages?", "o": ["All data in tables", "Item metadata and definitions, not data", "Only permissions", "Only semantic models"], "a": [1], "e": "Data and permissions are not copied, so the target stage must have its own data and access setup."}, {"q": "Where are sensitivity labels that you apply to Fabric items defined?", "o": ["Azure Policy", "Microsoft Purview Information Protection", "Git", "Entra ID group settings"], "a": [1], "e": "Labels are created in Microsoft Purview and applied to Fabric items, with inheritance and protection settings governed by tenant policy."}, {"q": "What is the role of T-SQL permissions in Microsoft Fabric's security model?", "o": ["It determines whether a row is accessible to a user based on certain conditions.", "To apply granular permissions for accessing data through the SQL analytics endpoint.", "The user does not have the appropriate OneLake security role assigned.", "It provides access control within a Fabric item, allowing specification of table or folder access."], "a": [1], "e": "T-SQL permissions (GRANT, DENY, RLS, CLS, DDM) govern relational query access when querying via the SQL analytics endpoint."}, {"q": "What is required to use Copilot for Data Warehouse?", "o": ["Any trial", "A paid Fabric capacity (F2 or higher, or P1+) with the Copilot tenant setting enabled", "An on-premises server", "A Warehouse in Power BI Pro only"], "a": [1], "e": "Copilot needs a paid capacity and admin enablement (verify the current minimum SKU)."}, {"q": "A shortcut placed under Tables that points to ADLS Gen2 must target what?", "o": ["Any CSV folder", "A zip archive", "A Delta table folder", "A SQL database"], "a": [2], "e": "For a shortcut to appear as a table, the target must be in Delta format (Files shortcuts accept any format)."}, {"q": "How do you query a warehouse table as it existed at an earlier time?", "o": ["VERSION AS OF", "RESTORE", "DESCRIBE HISTORY", "OPTION (FOR TIMESTAMP AS OF ...)"], "a": [3], "e": "Warehouse time travel uses the FOR TIMESTAMP AS OF query hint within the retention window."}, {"q": "A viewer of a Real-Time Dashboard wants an email when a tile's value passes a threshold. What do you use?", "o": ["A deployment rule", "Set alert on the tile, which creates an Activator rule", "A Dataflow refresh", "A workspace identity"], "a": [1], "e": "Dashboard tiles can create Activator alerts that send email or Teams messages."}, {"q": "Which lakehouse component provides read-only T-SQL access to Delta tables?", "o": ["SQL analytics endpoint", "Eventhouse", "Deployment pipeline", "Data wrangler"], "a": [0], "e": "Every lakehouse gets an auto-generated SQL analytics endpoint. It supports queries and views, not data modification."}, {"q": "You need to copy data from an on-premises SQL Server into a lakehouse. What is required?", "o": ["A Spark custom pool", "An on-premises data gateway", "A KQL database", "An eventstream"], "a": [1], "e": "Private or on-premises sources are reached through an on-premises (or VNet) data gateway."}, {"q": "In a lakehouse, where are managed Delta tables that the SQL endpoint can discover stored?", "o": ["Files", "Notebooks", "Tables", "Environment"], "a": [2], "e": "The Tables section holds managed Delta tables. The Files section holds raw or unmanaged data."}, {"q": "Which Spark pool type gives the fastest session start in Fabric?", "o": ["Custom pool with XX-Large nodes", "A pool in another region", "A pool with autoscale off", "Starter pool"], "a": [3], "e": "Starter pools are pre-warmed, so sessions start in seconds. Custom pools take a few minutes."}, {"q": "What can a workspace Viewer do with a lakehouse by default?", "o": ["Read files through Spark", "Query through the SQL analytics endpoint but not browse lakehouse files or run Spark over them", "Write new tables", "Delete the lakehouse"], "a": [1], "e": "Viewers get read access through the SQL endpoint but need extra permissions (such as ReadAll) for OneLake or Spark access."}, {"q": "A pipeline fails on activity 5 of 7 due to a transient network error. What is the quickest way to finish the run?", "o": ["Recreate the pipeline", "Rerun from the failed activity", "Scale up the capacity", "Delete the earlier outputs and rerun everything"], "a": [1], "e": "Monitor hub and run details allow rerunning from the failed activity, so successful earlier steps are not repeated."}, {"q": "To comply with data privacy regulations, your company needs to ensure that non-administrative users cannot view full account numbers in the Fabric data warehouse. Which security feature should you implement?", "o": ["Dynamic data masking", "Assign compute permissions specific to the SQL analytics endpoint.", "The user does not have the appropriate OneLake security role assigned.", "Create a OneLake security role with ReadWrite permission for specified folders."], "a": [0], "e": "Dynamic data masking (DDM) obfuscates sensitive column values on the fly for non-privileged users without altering underlying data."}, {"q": "A user reports that they cannot access any data in a lakehouse even though they can see the lakehouse item in their workspace. What is the most likely cause of this issue?", "o": ["The DENY always supersedes the GRANT, and the user is denied access to the specific object.", "It determines whether a row is accessible to a user based on certain conditions.", "The user does not have the appropriate OneLake security role assigned.", "The user does not meet any condition in the RLS policy's predicate."], "a": [2], "e": "Lakehouse metadata visibility does not guarantee data access; users require assignment to an appropriate OneLake security role to read tables and files."}, {"q": "From a Warehouse, how do you query a lakehouse table in the same workspace?", "o": ["With an abfss:// path in T-SQL", "With a Spark session", "With a three-part name such as MyLakehouse.dbo.Orders", "It is not possible"], "a": [2], "e": "Cross-database queries use three-part names within a workspace."}, {"q": "How many stages can a deployment pipeline have?", "o": ["Exactly 3", "2 to 10 (3 by default: Development, Test, Production)", "Exactly 5", "Unlimited"], "a": [1], "e": "You can customize stage count and names within that range."}, {"q": "Which PySpark pattern saves a DataFrame as a managed Delta table partitioned by order_date?", "o": ["df.show(partition='order_date')", "df.cache().save()", "df.write.format('delta').partitionBy('order_date').saveAsTable('orders')", "spark.sql('PARTITION orders')"], "a": [2], "e": "saveAsTable registers a managed table, and partitionBy controls the layout. Partition only on low-cardinality columns."}]}, {"name": "Practice Test 2", "q": [{"q": "A Structured Streaming job must run continuously and restart automatically after failures. What should you use?", "o": ["A Spark job definition with a retry policy", "An interactive notebook cell", "A Dataflow Gen2", "A pipeline Wait activity"], "a": [0], "e": "Spark job definitions support retry policies for long-running jobs. Notebooks are interactive and not meant for always-on streams."}, {"q": "In Microsoft Fabric Activator, which detection approach would be suitable for alerting when a truck's temperature exceeds a predefined limit?", "o": ["By automatically sending alerts when shipments deviate from their expected paths, enabling quick corrective actions.", "Run a Fabric activity.", "Threshold monitoring", "Review the rule configuration to ensure the conditions are correctly set to trigger actions at the specified threshold."], "a": [2], "e": "Threshold monitoring checks whether a metric value crosses a fixed ceiling or floor limit."}, {"q": "Dataflow Gen2 provides which low-code transformation experience?", "o": ["Spark notebooks only", "A KQL editor", "Power Query Online", "A visual T-SQL designer only"], "a": [2], "e": "Dataflow Gen2 is Power Query Online with the added ability to write to output destinations."}, {"q": "What is the purpose of the Real-Time hub?", "o": ["Store Delta tables for Spark", "Schedule pipelines", "Provide one place to discover, connect to, and manage streaming data across the tenant", "Host semantic models"], "a": [2], "e": "The Real-Time hub catalogs streams, Eventhouse tables, and Fabric events, and lets you start new connections from one location."}, {"q": "Which dynamic data masking function shows the first letter of an email address and masks the rest in the form aXXX@XXXX.com?", "o": ["default()", "random()", "partial()", "email()"], "a": [3], "e": "email() is the built-in masking function for email addresses."}, {"q": "Which item permission lets a user read lakehouse data through Spark and OneLake endpoints?", "o": ["ReadData", "Read", "Build", "ReadAll"], "a": [3], "e": "ReadAll grants access to the underlying OneLake data (and bypasses T-SQL row/column security). ReadData applies to the SQL endpoint."}, {"q": "How are statistics handled in a Fabric Warehouse?", "o": ["You must create all of them manually", "They are created and updated automatically, and you can also create them manually", "They are not used", "They exist only on clustered indexes"], "a": [1], "e": "The engine manages statistics. Manual CREATE STATISTICS or UPDATE STATISTICS helps after big loads."}, {"q": "Who can connect a workspace to a Git repository?", "o": ["Any Viewer", "Any Contributor", "A workspace Admin", "Any user in the tenant"], "a": [2], "e": "Connecting and disconnecting Git is a workspace Admin action. Contributors and above can then commit and update."}, {"q": "What is V-Order?", "o": ["A security role", "A write-time Parquet optimization that speeds reads, especially for Power BI/Direct Lake and the SQL endpoint", "A compression for CSV", "A KQL policy"], "a": [1], "e": "V-Order sorts and encodes Parquet for faster reads at some write cost. Defaults vary by workspace and profile (verify)."}, {"q": "When creating a Real-Time Dashboard in Microsoft Fabric, why is it recommended to use base queries when working with multiple tiles?", "o": ["Organize the dashboard using multiple pages for different types of data.", "Correctly configured KQL query", "Parameters", "To avoid duplicating logic across multiple tiles and ensure consistent data retrieval."], "a": [3], "e": "Consolidating common logic guarantees data consistency and simplifies query maintenance across the dashboard."}, {"q": "How do you restrict a user to specific columns of a table in a Warehouse?", "o": ["A security policy", "Dynamic data masking", "GRANT SELECT ON table (col1, col2) TO user", "A label"], "a": [2], "e": "Column-level security uses column lists in GRANT or DENY."}, {"q": "Events must be filtered and reshaped before they are stored in a KQL table. Which eventstream-to-Eventhouse mode do you choose?", "o": ["Direct ingestion", "Event processing before ingestion", "Derived stream only", "OneLake availability"], "a": [1], "e": "Event processing before ingestion lets you apply operators first. Direct ingestion lands raw events as fast as possible."}, {"q": "What is a critical component to ensure real-time data visualization in a newly created dashboard tile?", "o": ["Correctly configured KQL query", "Parameters", "Organize the dashboard using multiple pages, each dedicated to a specific type of data.", "To avoid duplicating logic across multiple tiles and ensure consistent data retrieval."], "a": [0], "e": "Fabric Real-Time Dashboard visual tiles are powered by Kusto Query Language (KQL) queries that pull and shape data from Eventhouses."}, {"q": "How are PRIMARY KEY, UNIQUE, and FOREIGN KEY constraints handled in a Fabric Warehouse?", "o": ["They are enforced", "They are metadata only (NOT ENFORCED)", "They are not supported at all", "Only foreign keys are enforced"], "a": [1], "e": "Constraints are declared as NOT ENFORCED, so you must prevent duplicates in your load logic."}, {"q": "Which of the following best describes the visual query editor in Microsoft Fabric?", "o": ["A surrogate key is a unique identifier specific to the data warehouse, used for maintaining consistency and accuracy.", "Use indexes on frequently joined columns to speed up query execution.", "A new row is added for the updated value, and the previous row is marked as expired.", "It provides a no-code interface that automatically generates a T-SQL query based on your canvas operations."], "a": [3], "e": "The Visual Query Editor provides a graphical, no-code canvas that translates visual transformations directly into T-SQL queries."}, {"q": "Which statement creates a new warehouse table from a query result?", "o": ["COPY TABLE", "CLONE INTO", "CREATE TABLE ... AS SELECT (CTAS)", "LOAD TABLE"], "a": [2], "e": "CTAS is a set-based way to build a table from a query."}, {"q": "Which T-SQL option is the fastest way to bulk load files from storage into a Warehouse?", "o": ["COPY INTO", "Row-by-row INSERT", "A cursor loop", "A trigger"], "a": [0], "e": "COPY INTO is the high-throughput bulk path. Avoid single-row inserts."}, {"q": "Which transformation should be used to filter out invalid data in an eventstream pipeline?", "o": ["Subsequent transformations may produce inaccurate results or errors.", "Custom endpoint", "The destination endpoint is incorrectly configured or unreachable", "Filter"], "a": [3], "e": "The Filter transformation evaluates boolean expressions to retain valid events and drop invalid or malformed records."}, {"q": "In a medallion architecture, what belongs in the bronze layer?", "o": ["Final business aggregates", "Only deduplicated data", "Raw data as ingested, plus audit columns such as load time and source", "Semantic models"], "a": [2], "e": "Bronze keeps data as-is for replay and lineage, usually append-only."}, {"q": "Over what period are background operations (such as scheduled refreshes and Spark batch jobs) smoothed for capacity accounting?", "o": ["5 minutes", "About 24 hours", "1 hour", "They are not smoothed"], "a": [1], "e": "Background work is smoothed over about 24 hours, which is why short spikes do not immediately throttle a capacity."}, {"q": "Which Fabric item hosts one or more KQL databases with shared compute and caching for real-time data?", "o": ["Lakehouse", "Warehouse", "Eventhouse", "Data pipeline"], "a": [2], "e": "An Eventhouse is the container for KQL databases optimized for time-series and streaming data."}, {"q": "In Microsoft Fabric Activator, which action type should be used when you need to process and analyze data further after a condition is detected?", "o": ["Fabric item actions", "Teams actions", "Average", "Threshold monitoring"], "a": [0], "e": "Fabric item actions trigger downstream data processing workflows, such as launching a Fabric data pipeline or running a notebook."}, {"q": "In Microsoft Fabric, how can you ensure a user has ReadWrite access to only specific folders within a lakehouse, without granting workspace-wide write permissions?", "o": ["The DENY always supersedes the GRANT, and the user is denied access to the specific object.", "It determines whether a row is accessible to a user based on certain conditions , "e": "A star schema features a central fact table containing quantitative metrics surrounded by denormalized, directly linked dimension tables."}, {"q": "How do you read a Delta table as it was at version 3 in PySpark?", "o": ["spark.read.version(3)", "spark.read.format('delta').option('versionAsOf', 3).load(path)", "df.cache(3)", "OPTIMIZE ... VERSION 3"], "a": [1], "e": "Delta time travel uses versionAsOf or timestampAsOf."}, {"q": "After implementing row-level security in your Microsoft Fabric data warehouse, a user reports they cannot see any data in a specific table. What could be a potential cause of this issue?", "o": ["The user does not meet any condition in the RLS policy's predicate.", "Assign compute permissions specific to the SQL analytics endpoint.", "The user does not have the appropriate OneLake security role assigned.", "It limits data exposure by obscuring sensitive information in real time."], "a": [0], "e": "When an RLS security predicate evaluates to FALSE or NULL for all rows under the user's identity, the query engine returns an empty result set."}, {"q": "What is the expected outcome if a 'Filter' transformation is used incorrectly, allowing invalid data to pass through to subsequent transformations in an eventstream?", "o": ["Manage fields transformation", "Subsequent transformations may produce inaccurate results or errors.", "Join", "Filter transformation to isolate high-priority alerts, then configure a derived stream to route alerts to a custom endpoint"], "a": [1], "e": "Corrupted or invalid records passing downstream cause calculation inaccuracies, casting exceptions, or aggregation errors."}, {"q": "When configuring an eventstream pipeline, you need to ensure that real-time data from Azure IoT Hub is transformed into a standardized format for downstream compatibility. Which transformation should you use to achieve this?", "o": ["Manage fields transformation to change data types and rename fields", "Custom endpoint", "Subsequent transformations may produce inaccurate results or errors.", "The destination endpoint is incorrectly configured or unreachable"], "a": [0], "e": "Manage fields directly enables field renaming and type casting to achieve downstream schema compatibility."}, {"q": "Your team has created a dashboard with multiple tiles showing bike availability data. Each tile uses a similar KQL query. What approach would best improve the maintainability of this dashboard?", "o": ["Implement a base query to handle the common data retrieval and have each tile query reference it.", "Interactive parameters for neighborhood-specific filtering.", "By consolidating shared logic into a single query that multiple tiles can reference.", "Correctly configured KQL query"], "a": [0], "e": "Future logic modifications only need to be applied in one place (the base query) rather than across every individual tile."}, {"q": "What does the grain of a fact table describe?", "o": ["The number of columns", "The level of detail that one row represents", "The partition key", "The clustering order"], "a": [1], "e": "For example, one row per order line per day. Declare the grain before designing the table."}, {"q": "A KQL join with no kind returns fewer rows than you expect. What is the most likely reason?", "o": ["The default kind is innerunique, which deduplicates the left side on the join key", "The default is fullouter", "Joins are limited to 100 rows", "Join sorts and trims the result"], "a": [0], "e": "Use kind=inner for a standard inner join and kind=leftouter for a left join."}, {"q": "A pipeline must run a PySpark transformation after files have been copied. Which activity do you add?", "o": ["Notebook", "Stored procedure", "Set variable", "Get Metadata"], "a": [0], "e": "The Notebook activity runs a Fabric notebook and can pass parameters to it."}, {"q": "Your organization wants to create a derived stream to route high-priority alerts from a sensor data stream to a custom endpoint for immediate action. What steps should be involved in setting up this configuration?", "o": ["Filter", "Subsequent transformations may produce inaccurate results or errors.", "Filter transformation to isolate high-priority alerts, then configure a derived stream to route alerts to a custom endpoint", "The destination endpoint is incorrectly configured or unreachable"], "a": [2], "e": "High-priority items are isolated via a Filter transformation and then output through a derived stream to a custom endpoint."}, {"q": "Which KQL query returns average Temp per device in 5-minute buckets?", "o": ["T | summarize avg(Temp) by DeviceId, bin(Timestamp, 5m)", "T | project avg(Temp) every 5m", "T | extend bin(5m) | avg(Temp)", "T | where bin(Timestamp, 5m)"], "a": [0], "e": "summarize ... by bin(Timestamp, 5m) creates tumbling time buckets."}, {"q": "You notice that the Real-Time Dashboard displaying bike availability has become cluttered and difficult to navigate. What is the most effective method to reorganize the data for improved clarity and user experience?", "o": ["Organize the dashboard using multiple pages, each dedicated to a specific type of data.", "Use base queries to avoid duplicating logic across tiles", "Organize the dashboard using multiple pages for different types of data.", "Implement a base query to handle the common data retrieval and have each tile query reference it."], "a": [2], "e": "Partitioning tiles across multiple thematic pages/tabs prevents visual clutter and streamlines navigation."}, {"q": "A company wants to combine data from two streaming sources based on a matching condition. Which eventstream transformation should they use?", "o": ["Filter", "Join", "Manage fields transformation to change data types and rename fields", "Manage fields transformation"], "a": [1], "e": "Correlating and combining two streams on a common key condition within a temporal window requires a Join transformation."}, {"q": "What is a KQL materialized view used for?", "o": ["A continuously maintained aggregation or deduplicated view of a source table for fast queries", "Copying a table to a lakehouse", "Masking sensitive columns", "Laying out a dashboard"], "a": [0], "e": "Materialized views precompute results (for example latest value per key), so queries read less data."}, {"q": "Which action can a workspace Contributor not do?", "o": ["Create notebooks", "Edit pipelines", "Share items or manage workspace access", "Run notebooks"], "a": [2], "e": "Contributors create and edit content but cannot share items or manage access. Members can share and add lower roles."}, {"q": "Row-level security in a Warehouse is built with which combination?", "o": ["An inline table-valued function (predicate) plus a security policy", "DENY SELECT", "The UNMASK permission", "A sensitivity label"], "a": [0], "e": "The function defines which rows match, and the security policy applies it as a filter (or block) predicate."}, {"q": "A config table lists 40 source tables. You want to copy them all in parallel with identical logic. Which pattern fits?", "o": ["Wait, then Until", "Switch, then Fail", "Lookup, then ForEach (parallel) containing a Copy activity", "Filter, then Set variable"], "a": [2], "e": "A metadata-driven pattern reads the list with Lookup and loops with ForEach (batch count controls parallelism)."}, {"q": "User clickstream events should be grouped until there is a 15-minute gap with no activity. Which window type?", "o": ["Session", "Tumbling", "Hopping", "Sliding"], "a": [0], "e": "Session windows have variable length and close after a timeout with no events."}, {"q": "Which PySpark statement reads a headered CSV folder and infers column types?", "o": ["spark.csv.load('Files/raw/')", "spark.read.delta('Files/raw/')", "spark.table('Files/raw/')", "spark.read.option('header','true').option('inferSchema','true').csv('Files/raw/')"], "a": [3], "e": "The DataFrameReader with header and inferSchema options is the standard CSV read."}, {"q": "When configuring Micro ibraries, Spark properties) take effect only after you publish it."}]}, {"name": "Practice Test 3", "q": [{"q": "In a type 2 slowly changing dimension, what happens when a dimension attribute changes?", "o": ["MERGE statement to efficiently update and insert product details.", "A new row is added for the updated value, and the previous row is marked as expired.", "A surrogate key is a unique identifier specific to the data warehouse, used for maintaining consistency and accuracy.", "queryinsights.long_running_queries to get ranked execution times."], "a": [1], "e": "SCD Type 2 inserts a new record with the updated attributes while setting the previous record's end date/flag to expired."}, {"q": "You need a 10-minute aggregate recalculated every 2 minutes, so consecutive windows overlap. Which window type?", "o": ["Tumbling", "Hopping", "Session", "Snapshot"], "a": [1], "e": "Hopping windows have a fixed size and advance by a smaller hop, so events fall into several windows."}, {"q": "You have implemented dynamic data masking in your Microsoft Fabric data warehouse, but users are still seeing unmasked data. What could be a reason for this issue?", "o": ["Create a OneLake security role with ReadWrite permission for specified folders.", "The user does not have the appropriate OneLake security role assigned.", "Users have been granted UNMASK permission.", "Assign compute permissions specific to the SQL analytics endpoint."], "a": [2], "e": "Users with explicit or inherited UNMASK database permissions bypass masking rules and see cleartext data."}, {"q": "What is the purpose of connecting a Fabric workspace to a Git repository?", "o": ["By writing comments in your query using -- to describe your intent.", "To sync content between the workspace and Git, ensuring they have the same content.", "It adds a summary and inline comments to describe the query's functionality.", "Deployment pipelines automate the movement of content through the development, test, and production stages."], "a": [1], "e": "Workspace-Git integration ensures bidirectional synchronization between workspace item definitions and the remote repository."}, {"q": "What is one of the main benefits of using Copilot in Microsoft Fabric Data Warehouse?", "o": ["Using descriptive table and column names in your data warehouse.", "Investigate the cause by viewing activity details and comparing against historical runs to identify what changed.", "It generates T-SQL queries and provides intelligent code completions.", "To sync content between the workspace and Git, ensuring they have the same content."], "a": [2], "e": "Copilot assists SQL developers by generating queries from natural language descriptions and providing contextual code completions."}, {"q": "Which Delta table property enables Change Data Feed?", "o": ["delta.appendOnly = true", "delta.logRetentionDuration", "delta.autoOptimize", "delta.enableChangeDataFeed = true"], "a": [3], "e": "With CDF on, you can read inserts, updates, and deletes (_change_type) with option('readChangeFeed','true')."}, {"q": "Which permission model should be applied if a user needs access to specific columns in a table within a lakehouse?", "o": ["It limits data exposure by obscuring sensitive information in real time.", "It determines whether a row is accessible to a user based on certain conditions.", "The user does not meet any condition in the RLS policy's predicate.", "Column-level security using OneLake security roles"], "a": [3], "e": "Granular access restriction targeting specific columns within a lakehouse table is implemented via OneLake security roles."}, {"q": "Where do you see capacity utilization, throttling, and the top consuming items?", "o": ["Git status panel", "Deployment compare view", "Endorsement settings", "The Capacity Metrics app"], "a": [3], "e": "The Capacity Metrics app is installed by an admin and shows CU consumption, smoothing, and throttling."}, {"q": "What does OPTIMIZE do on a Delta table?", "o": ["Compacts many small files into larger ones", "Deletes old files", "Encrypts data", "Changes the schema"], "a": [0], "e": "OPTIMIZE bin-packs small files to speed reads. VACUUM is the command that removes old files."}, {"q": "Which pipeline expression returns today's UTC date as yyyy-MM-dd text?", "o": ["@today()", "@pipeline().Today", "@formatDateTime(utcnow(),'yyyy-MM-dd')", "@date.now"], "a": [2], "e": "utcnow() returns the current timestamp and formatDateTime formats it."}, {"q": "How can you optimize a Real-Time Dashboard with multiple tiles sharing similar data queries?", "o": ["Use base queries to avoid duplicating logic across tiles", "Organize the dashboard using multiple pages, each dedicated to a specific type of data.", "Parameters", "Correctly configured KQL query"], "a": [0], "e": "Base queries centralize shared data retrieval logic so downstream visual tiles can build on top of a single cached result, reducing query load."}, {"q": "Which of the following best describes the role of OneLake security in Microsoft Fabric?", "o": ["It provides access control within a Fabric item, allowing specification of table or folder access.", "No users or groups will be able to access the specified data despite the role's configuration.", "Create OneLake security roles and restrict access to specific tables containing patient records.", "It determines whether a row is accessible to a user based on certain conditions."], "a": [0], "e": "OneLake security defines fine-grained data-plane access control (tables and folders) within Fabric items."}, {"q": "How can an admin stop a runaway session in a Warehouse?", "o": ["DROP SESSION", "KILL session_id", "ALTER SESSION", "ABORT"], "a": [1], "e": "Find the session in sys.dm_exec_sessions or sys.dm_exec_requests, then KILL it."}, {"q": "If a user needs to execute queries using the SQL analytics endpoint but should not access any data through other engines, which permission configuration is appropriate?", "o": ["Assign compute permissions specific to the SQL analytics endpoint.", "It limits data exposure by obscuring sensitive information in real time.", "Create a OneLake security role with ReadWrite permission for specified folders.", "The user does not have the appropriate OneLake security role assigned."], "a": [0], "e": "Restricting permissions to the SQL analytics endpoint ensures the user can run T-SQL queries while preventing access via Spark, notebooks, or lakehouse APIs."}, {"q": "What does the 'Explain' quick action do in the SQL query editor?", "o": ["To sync content between the workspace and Git, ensuring they have the same content.", "It adds a summary and inline comments to describe the query's functionality.", "By writing comments in your query using -- to describe your intent.", "Investigate the cause by viewing activity details and comparing against historical runs to identify what changed."], "a": [1], "e": "Copilot's Explain action adds descriptive summaries and inline comments explaining the logic without executing the query."}, {"q": "How can Microsoft Fabric Activator help your organization respond to shipment deviations from planned routes?", "o": ["By automatically sending alerts when shipments deviate from their expected paths, enabling quick corrective actions.", "Review the rule configuration to ensure the conditions are correctly set to trigger actions at the specified threshold.", "Threshold monitoring", "Run a Fabric activity."], "a": [0], "e": "Activator performs real-time continuous rule evaluation on streaming telemetry to alert teams instantly when anomalies occur."}, {"q": "What is the primary function of deployment pipelines in Fabric?", "o": ["By writing comments in your query using -- to describe your intent.", "Deployment pipelines automate the movement of content through the development, test, and production stages.", "Git lets your team collaborate using branches, and provides version control. It helps manage incremental code changes, and see code history.", "To provide a centralized view of recent activity status across a workspace, including the ability to view details and historical runs."], "a": [1], "e": "Fabric deployment pipelines manage Application Lifecycle Management (ALM) by automating content promotion across sequential environment stages."}, {"q": "How can you guide Copilot to generate a specific SQL query in the editor?", "o": ["Investigate the cause by viewing activity details and comparing against historical runs to identify what changed.", "Using descriptive table and column names in your data warehouse.", "By writing comments in your query using -- to describe your intent.", "It generates T-SQL queries and provides intelligent code completions."], "a": [2], "e": "Prefixing instructions with -- in the SQL editor prompts Copilot inline to generate the matching T-SQL code."}, {"q": "How can Eventhouse table data be made available as Delta tables in OneLake for Spark and SQL consumers without building copy pipelines?", "o": ["Create a Dataflow Gen2", "Turn on OneLake availability", "Export with a notebook each night", "Use a Warehouse clone"], "a": [1], "e": "OneLake availability exposes KQL tables as Delta/Parquet in OneLake (verify behavior for your tables)."}, {"q": "Which KQL operator expands a dynamic array column into one row per element?", "o": ["bag_unpack", "mv-expand", "parse", "make-series"], "a": [1], "e": "mv-expand flattens multi-value (array) columns. bag_unpack turns a property bag into columns."}, {"q": "Which transformation would be most suitable for ensuring that incoming data streams have consistent naming conventions before being routed to their destination?", "o": ["Custom endpoint", "Manage fields transformation to change data types and rename fields", "Manage fields transformation", "Subsequent transformations may produce inaccurate results or errors."], "a": [2], "e": "Manage fields allows renaming attributes, casting data types, and modifying schema columns for standardization const app=document.getElementById('app'),L='ABCDEFGH';let hist=[],canStore=true;
try{localStorage.setItem('fabtest','1');localStorage.removeItem('fabtest');hist=JSON.parse(localStorage.getItem('fabhist')||'[]')}catch(e){canStore=false}
function saveH(){try{localStorage.setItem('fabhist',JSON.stringify(hist))}catch(e){canStore=false}}
function addHist(k,c,n,p){hist.unshift({k,name:DATA[k].name,c,n,p,t:Date.now()});saveH()}
function bestTxt(k){const a=hist.filter(h=>h.k===k);return a.length?'Best: '+Math.max(...a.map(h=>h.p))+'% | Attempts: '+a.length:'Not attempted yet'}
function clearHist(){if(confirm('Clear all saved history?')){hist=[];try{localStorage.removeItem('fabhist')}catch(e){}home()}}
const PASS=80,HI='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>';
const badge=p=>`<span class="pf ${p>=PASS?'ok':'no'}">${p>=PASS?'PASS':'FAIL'}</span>`;
function kpi(l,v,s,c){return `<div class="kpi"><div class="mu">${l}</div><div class="kv"${c?` style="color:${c}"`:''}>${v}</div><div class="mu ks">${s||'&nbsp;'}</div></div>`}
function chart(){const a=hist.slice(0,10).reverse(),W=330,H=125,l=26,r=8,t=10,b=18,w=W-l-r,h=H-t-b,y=v=>t+h-v/100*h,x=i=>l+(a.length==1?w/2:i*w/(a.length-1));
let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Last scores">`;
[0,50,100].forEach(v=>s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="${l-4}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="var(--mu)">${v}</text>`);
s+=`<line x1="${l}" x2="${W-r}" y1="${y(PASS)}" y2="${y(PASS)}" stroke="var(--nob)" stroke-dasharray="4 3"/><text x="${W-r}" y="${y(PASS)-3}" font-size="9" text-anchor="end" fill="var(--nob)">Pass ${PASS}%</text>`;
s+=`<polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${a.map((q,k)=>x(k)+','+y(q.p)).join(' ')}"/>`;
a.forEach((q,k)=>s+=`<circle cx="${x(k)}" cy="${y(q.p)}" r="4.5" fill="${q.p>=PASS?'var(--okb)':'var(--nob)'}"><title>${q.name}: ${q.p}%</title></circle><text x="${x(k)}" y="${H-5}" font-size="9" text-anchor="middle" fill="var(--mu)">#${hist.length-(a.length-1-k)}</text>`);
return s+'</svg>'}
function histHTML(){const note=canStore?'Saved in this browser, so it stays after a refresh.':'Browser storage is unavailable here, so history lasts only until you refresh this page.';
if(!hist.length)return `<div class="card"><b>Score history</b><div class="mu" style="margin-top:6px">No tests taken yet. Pass mark is ${PASS}%. ${note}</div></div>`;
const n=hist.length,ps=hist.map(h=>h.p),m=a=>Math.round(a.reduce((s,v)=>s+v,0)/a.length),avg=m(ps),pass=ps.filter(v=>v>=PASS).length,l5=m(ps.slice(0,5)),d=n>1?ps[0]-ps[1]:null;
return `<div class="card"><b>Score history</b><div class="mu" style="margin:4px 0 12px">Pass mark is ${PASS}%. ${note}</div><div class="kgrid">`+
kpi('Attempts',n,'tests taken')+kpi('Average',avg+'%','across all attempts',avg>=PASS?'var(--okb)':'var(--nob)')+kpi('Best score',Math.max(...ps)+'%','Lowest '+Math.min(...ps)+'%')+
kpi('Pass rate',Math.round(pass/n*100)+'%',pass+' of '+n+' passed',pass/n>=.5?'var(--okb)':'var(--nob)')+kpi('Last 5 average',l5+'%',d==null?'':'Latest '+(d>=0?'+':'')+d+' pts vs previous')+
`<div class="kpi kc"><div class="mu">Trend: last ${Math.min(n,10)} scores</div>${chart()}</div></div>`+
`<table style="margin-top:14px"><tr><th>#</th><th>Test</th><th>Score</th><th>Result</th><th>Correct</th><th>Date</th></tr>`+
hist.map((h,x)=>`<tr><td>${n-x}</td><td>${h.name}</td><td class="pc">${h.p}%</td><td>${badge(h.p)}</td><td>${h.c}/${h.n}</td><td>${new Date(h.t).toLocaleString()}</td></tr>`).join('')+
`</table><div class="row"><button class="b g" onclick="clearHist()">Clear history</button></div></div>`}
let S,i,sel,done;
function home(){app.innerHTML=`<h1>Microsoft Fabric Practice Tests</h1><div class="mu">${DATA.reduce((n,s)=>n+s.q.length,0)} questions in ${DATA.length} sets. Pick a set to start.</div><div class="grid">`+
DATA.map((s,k)=>`<button class="set" onclick="start(${k})"><b>${s.name}</b>${s.q.length} questions<div class="best">${bestTxt(k)}</div></button>`).join('')+'</div>'+histHTML()}
function start(k){S=k;i=0;sel=DATA[k].q.map(()=>[]);done=DATA[k].q.map(()=>false);show()}
function show(){const q=DATA[S].q[i],n=DATA[S].q.length,multi=q.a.length>1,d=done[i];
app.innerHTML=`<div class="top2"><button class="b hm" onclick="home()">${HI} Home</button><b>${DATA[S].name}</b></div>
<div class="card"><div class="mu">Question ${i+1} of ${n}<span class="tag">${multi?'Select '+q.a.length:'Single choice'}</span></div><div class="bar"><i style="width:${(i+1)/n*100}%"></i></div>
<h3 style="margin:8px 0 12px">${q.q}</h3><div id="opts">`+q.o.map((t,k)=>{let c='opt'+(d?' lock':''),ck=sel[i].includes(k);
if(d){if(q.a.includes(k))c+=' ok';else if(ck)c+=' no'}
return `<label class="${c}"><input type="${multi?'checkbox':'radio'}" name="o" ${ck?'checked':''} ${d?'disabled':''} onchange="pick(${k})"><span>${t}</span></label>`}).join('')+`</div>
<div id="fb">${d?fb():''}</div><div class="msg" id="msg"></div>
<div class="row"><button class="b g" onclick="check()" ${d?'disabled':''}>Check answers</button><button class="b" onclick="next()">${i==n-1?'Submit':'Next'}</button></div></div>`}
function pick(k){if(done[i])return;const m=DATA[S].q[i].a.length>1;if(m){const x=sel[i].indexOf(k);x<0?sel[i].push(k):sel[i].splice(x,1)}else sel[i]=[k];document.getElementById('msg').textContent=''}
const same=(a,b)=>a.length==b.length&&a.every(x=>b.includes(x));
function fb(){const q=DATA[S].q[i],r=same(sel[i],q.a);return `<div class="exp ${r?'ok':'no'}"><b>${r?'Correct!':'Incorrect.'}</b> ${r?'':'Correct answer: '+q.a.map(k=>L[k]).join(', ')+'.'}<br>${q.e}</div>`}
function check(){if(!sel[i].length){document.getElementById('msg').textContent='Please select an answer first.';return}done[i]=true;show()}
function next(){const n=DATA[S].q.length;if(!done[i]&&!sel[i].length&&!confirm('No answer selected. Skip this question?'))return;if(i<n-1){i++;show()}else finish()}
function score(){const Q=DATA[S].q,c=Q.filter((q,k)=>same(sel[k],q.a)).length;return[c,Q.length,Math.round(c/Q.length*100)]}
function finish(){const[c,n,p]=score();addHist(S,c,n,p);result()}
function result(){const[c,n,p]=score(),ok=p>=PASS;
app.innerHTML=`<div class="card"><h2 style="text-align:center">${DATA[S].name} complete</h2><div class="res"><div class="big" style="color:${ok?'var(--okb)':'var(--nob)'}">${p}%</div>${badge(p)}</div><p style="text-align:center">${c} of ${n} answered correctly. Pass mark is ${PASS}%. ${ok?'Nice work!':'Keep practicing, you can beat this.'}</p><div class="row" style="justify-content:center"><button class="b g" onclick="home()">Back to home</button><button class="b g" onclick="start(S)">Retry this set</button><button class="b" onclick="review()">Review answers</button></div></div>`;window.scrollTo(0,0)}
function review(){const Q=DATA[S].q,[c,n,p]=score();
app.innerHTML=`<div class="top"><button class="b hm" onclick="home()">${HI} Home</button><button class="b g" onclick="result()">Back to result</button><span><b>${DATA[S].name}</b> review: ${c}/${n} (${p}%) ${badge(p)}</span></div>`+
Q.map((q,k)=>{const m=q.a.length>1,r=same(sel[k],q.a);
return `<div class="card"><div class="mu">Question ${k+1} of ${n}<span class="tag">${m?'Select '+q.a.length:'Single choice'}</span><span class="pf ${r?'ok':'no'}" style="margin-left:8px;font-size:12px;padding:2px 10px">${r?'Correct':sel[k].length?'Incorrect':'Not answered'}</span></div><h3 style="margin:8px 0 12px">${q.q}</h3>`+
q.o.map((t,x)=>{const s=sel[k].includes(x),g=q.a.includes(x);return `<div class="opt lock${g?' ok':s?' no':''}"><input type="${m?'checkbox':'radio'}" disabled ${s?'checked':''}><span>${t}${s?' <em class="mu">(your answer)</em>':''}${g?' <em class="mu">(correct)</em>':''}</span></div>`}).join('')+
`<div class="exp ${r?'ok':'no'}"><b>${r?'Correct!':(sel[k].length?'Incorrect.':'Not answered.')}</b> ${r?'':'Correct answer: '+q.a.map(x=>L[x]).join(', ')+'.'}<br>${q.e}</div></div>`}).join('')+
`<div class="row"><button class="b hm" onclick="home()">${HI} Home</button><button class="b g" onclick="window.scrollTo(0,0)">Back to top</button></div>`;window.scrollTo(0,0)}
home();
