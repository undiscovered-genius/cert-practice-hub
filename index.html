Define dynamic data masking for sensitive columns.", "Grant UNMASK permission to authorized users.", "Remove all masking rules from a database.", "Revoke SELECT permission from non-privileged users.", "Test masking with a non-privileged user."], "a": [0, 1, 4], "e": "Defining dynamic data masking for sensitive columns ensures that unauthorized users cannot view sensitive information, aligning with the security objective. Granting UNMASK permission to authorized users allows them to access unmasked data, maintaining controlled access. Testing masking with a non-privileged user confirms the effectiveness of the masking rules, ensuring they work as intended. Removing all masking rules would expose sensitive data, contradicting the goal of protecting it. Revoking SELECT permission from non-privileged users is impractical as it restricts access to all data, not just sensitive information.", "t": 3}, {"q": "You have a Fabric pipeline that uses an Execute Pipeline activity to call a child pipeline named pl_LoadTables. The parent pipeline passes a parameter named tables. The parameter is defined as array in both pipelines.<br>In the child pipeline, a ForEach activity uses the following items expression.<br>@pipeline().parameters.tables<br>The pipeline run fails and generates the following error.<br>the result of the evaluation of 'foreach' expression '@pipeline().parameters.tables'<br>is of type 'String'. The result must be a valid array.<br>You need to ensure that tables is passed to the child pipeline as an array so that the ForEach activity can run.<br>What should you do in the parent pipeline?", "o": ["Change the tables parameter type in the child pipeline from Array to String.", "Change the ForEach items expression to @string(pipeline().parameters.tables).", "Wrap the parameter value by using the createArray() function in the Execute Pipeline activity.", "Add a pipeline parameter for the ForEach activity run ID and use the parameter as the items expression."], "a": [2], "e": "Wrapping the value by using createArray() in the Execute Pipeline activity ensures that the parameter is passed as an array, which enables the ForEach activity to iterate over the items successfully. Converting the parameter into a string does not meet the requirements, because the ForEach activity requires an array. Changing the parameter type in the child pipeline to String prevents the ForEach activity from iterating over multiple values. Adding a run ID parameter does not address the type mismatch that caused the failure.", "t": 0}, {"q": "You have a Fabric workspace that runs a pipeline every 15 minutes. The pipeline runs a Dataflow Gen2 to ingest data, and then triggers a semantic model refresh of a Microsoft Power BI report.<br>Business users access the report during business hours and require notifications when ingestion is delayed or fails.<br>You need to configure an alert that triggers automatically when a condition is detected in changing data.<br>What should you use?", "o": ["Activator", "Capacity", "Monitor hub", "OneLake"], "a": [0], "e": "Activator detects conditions in streaming or changing data and can trigger actions, such as alerts and workflows, when specified thresholds and events occur. This capability is designed for automated responses to data conditions. Monitor hub provides operational monitoring but does not create rule-based alerts on changing data. Capacity tools track capacity performance and utilization rather than ingestion conditions. OneLake is the unified storage layer and does not provide alerting functionality.", "t": 5}, {"q": "You use Microsoft Fabric to manage data across warehouses and lakehouses.<br>You need to integrate data from a warehouse and a lakehouse into a single table for analysis. The solution must minimize development effort.<br>What should you use?", "o": ["Azure Data Factory", "The CREATE TABLE AS SELECT (CTAS) statement.", "Dataflow Gen2", "The SELECT INTO statement."], "a": [1], "e": "The CREATE TABLE AS SELECT (CTAS) statement is the best choice for integrating data from a warehouse and a lakehouse into a single table, as it allows the creation of a new table based on combined data. Dataflow Gen2, while useful for data preparation and transformation, does not directly support creating new tables from combined data sources. The SELECT INTO statement can create a new table but is not suitable for integrating data from multiple sources. Azure Data Factory is a data integration service that might seem suitable for integrating data from multiple sources, but it does not directly support creating tables from combined data sources in a warehouse or lakehouse.", "t": 3}, {"q": "Your organization uses Microsoft Fabric to manage data pipelines for processing sales data.<br>Recently, a pipeline failed during execution, and the error logs indicate a missing data source in one of the Lookup activities.<br>You need to configure the pipeline to fail gracefully with a clear error message when such issues occur in the future.<br>What should you do?", "o": ["Add a conditional check to handle missing data sources.", "Add a Fail activity with a custom error message and code.", "Log errors and continue pipeline execution.", "Retry the pipeline execution automatically upon encountering missing data sources."], "a": [1], "e": "Adding a Fail activity with a custom error message and error code ensures the pipeline fails gracefully, meeting the requirement. Adding a conditional check to handle missing data sources does not ensure the pipeline fails with a clear error message when the data source is missing. Automatically retrying the pipeline does not address the requirement to fail the pipeline with a clear error message. Logging errors without failing the pipeline does not meet the requirement to stop execution with a clear error message.", "t": 0}, {"q": "Your organization uses Microsoft Fabric for analytics solutions.<br>You plan to set up deployment pipelines for transitions between development, testing, and production environments.<br>You need to ensure only verified changes are promoted to production.<br>What should you do?", "o": ["Assign one workspace to all stages.", "Create unique deployment rules for each stage.", "Deploy content across all stages simultaneously.", "Use selective deployment for content control."], "a": [3], "e": "Assigning one workspace to all stages undermines the separation of environments, which is vital for effective deployment management. Deploying content across all stages simultaneously bypasses necessary testing and control measures, risking untested changes reaching production. Using selective deployment allows specific content movement, ensuring only tested changes reach production, providing control over the deployment process.", "t": 5}, {"q": "You use Microsoft Fabric to manage data across cloud platforms.<br>You plan to ingest batch data from Azure Blob Storage into a warehouse.<br>You need to determine the most efficient method to import this data using Microsoft Fabric tools.<br>What should you use?", "o": ["Azure Synapse Analytics.", "COPY statement with Shared Access Signature.", "Pipeline.", "Dataflows Gen2."], "a": [1], "e": "The COPY statement with Shared Access Signature efficiently ingests batch data from Azure Blob Storage into a warehouse due to its direct and secure data transfer capabilities. In contrast, a Data Factory pipeline requires manual configuration, making it less efficient. Dataflows Gen2 focus on data preparation and transformation, which does not align with the task of batch data ingestion. Azure Synapse Analytics is not designed for efficient batch data ingestion using Microsoft Fabric tools.", "t": 3}, {"q": "Your company uses Microsoft Fabric's lakehouse architecture to store and process large volumes of data.<br>You notice that some queries are not performing as expected, particularly those involving user-defined functions (UDFs).<br>You need to ensure optimal query performance while maintaining use of UDFs.<br>What should you do?", "o": ["Enable high concurrency mode.", "Enable query caching.", "Switch to a different execution engine.", "Adjust spark configuration."], "a": [3], "e": "Using traditional Spark engine for queries involving UDFs ensures compatibility and maintains performance due to the native execution engine's lack of support for UDFs. Enabling high concurrency mode might improve overall throughput but does not address the specific performance issues with UDFs. Enabling query caching does not address the compatibility issue with UDFs in the native execution engine. Switching to a different execution engine might seem like a solution, but it does not resolve the compatibility issues with UDFs.", "t": 1}, {"q": "Your company is transitioning to a data mesh architecture using Microsoft Fabric.<br>You are responsible for organizing data into domains.<br>You need to configure settings for independent management of rules and restrictions by each business unit.<br>What should you do?", "o": ["Assign workspaces to multiple domains.", "Configure domain-specific sensitivity labels.", "Create workspaces with shared governance settings.", "Delegate tenant-level settings to domains."], "a": [3], "e": "Delegating tenant-level settings to the domain level allows each business unit to manage its own governance settings, which is essential for implementing a data mesh architecture. Assigning workspaces to multiple domains complicates governance and does not support independent management. Creating workspaces with shared governance settings centralizes control and does not facilitate domain-specific governance. Configuring domain-specific sensitivity labels is related to governance but does not address the need for independent management of rules and restrictions by each business unit.", "t": 4}, {"q": "Your organization uses Microsoft Fabric to manage data across cloud platforms.<br>You plan to integrate data from a cloud storage service into a lakehouse.<br>You need to ensure data from the cloud storage service is accessible within the lakehouse without duplication.<br>What should you do?", "o": ["Create a shortcut pointing to the cloud storage service.", "Use a Data Factory pipeline to copy data into the lakehouse.", "Use a Data Factory pipeline to export data to Azure Blob Storage and then import it into the lakehouse.", "Use a Data Factory pipeline to transform data before loading it into the lakehouse."], "a": [0], "e": "Creating a shortcut in the lakehouse pointing to the cloud storage service allows direct access to the data without creating redundant copies, leveraging Microsoft OneLake's capability to unify data across different storage systems. Using a Data Factory pipeline to transform and load data would result in redundant copies and increased storage costs, which is unnecessary when using Microsoft OneLake shortcuts.", "t": 1}, {"q": "Your company implements a new data analytics solution using Microsoft Fabric.<br>You need to design an orchestration pattern that minimizes manual intervention and supports dynamic data loading into a lakehouse.<br>Which approach should you recommend?", "o": ["Create individual pipelines for each data source.", "Implement a Data Factory pipeline with parameters and dynamic expressions.", "Use a single notebook for all ETL activities without parameters.", "Use a static configuration for data loading."], "a": [1], "e": "Implementing a Data Factory pipeline with parameters and dynamic expressions automates data loading, reduces manual intervention, and supports dynamic data handling. Using a static configuration lacks flexibility, while using a single notebook without parameters lacks flexibility. Creating individual pipelines for each data source increases complexity and maintenance.", "t": 1}, {"q": "Your organization is implementing a data mesh architecture using Microsoft Fabric.<br>The IT department plans to delegate governance controls to business units.<br>You need to configure settings for independent data management by business units.<br>Which three actions should you perform? Each correct answer presents part of the solution.", "o": ["Assign domain-specific sensitivity labels.", "Assign workspaces to domains.", "Delegate tenant settings to domains.", "Enable domain-level sensitivity labels.", "Implement row-level security.", "Specify domain administrators."], "a": [1, 2, 5], "e": "Assigning workspaces to specific domains ensures that all data within those workspaces is governed by the domain's rules and restrictions. Delegating tenant-level settings to the domain level allows each business unit to define its own rules and restrictions, enabling domain-specific governance. Specifying domain admins allows for effective management of domain settings and ensures that domain-specific governance is enforced. Implementing row-level security is a common data governance practice, but it does not directly enable domain-level governance in a data mesh architecture. Assigning domain-specific sensitivity labels is related to data protection but does not directly enable independent data management by business units.", "t": 4}, {"q": "Your company uses Microsoft Fabric to manage data pipelines for a large-scale analytics solution.<br>You notice that several pipeline executions failed due to errors in the Lookup activity, which returned no matching data.<br>You need to configure the pipeline to terminate with specific error details when the Lookup activity returns no matching data.<br>Which two actions should you perform? Each correct answer presents part of the solution.", "o": ["Add a Fail activity after the Lookup activity.", "Add a Retry activity after the Lookup activity.", "Add a Wait activity after the Lookup activity.", "Configure the Fail activity with specific error details.", "Use a Retry activity to handle the error."], "a": [0, 3], "e": "Adding a Fail activity after the Lookup activity is essential because it allows the pipeline to terminate with a specific error message and code, directly addressing the requirement. Configuring this Fail activity with detailed error information ensures that the pipeline provides clear feedback when it fails. Adding a Wait activity does not address the need for customized error termination. Using a Retry activity might seem like a way to handle errors but does not fulfill the requirement to fail the pipeline with specific error details.", "t": 0}, {"q": "You have a Fabric lakehouse that contains a Delta table named SalesSilver.<br>An Apache Spark structured streaming job writes to SalesSilver every minute and creates many small Parquet files.<br>Users query SalesSilver through the SQL analytics endpoint. Query latency is increasing because of the number of files.<br>You need to reduce small-file overhead by using persistent settings to ensure that future writes create fewer, larger files and the remaining fragmentation is compacted automatically. The solution must NOT change the streaming frequency or use a different engine.<br>What should you so?", "o": ["Set delta.parquet.vorder.enabled to true.", "Use RDDs instead of DataFrames in the Spark pipeline.", "Run VACUUM SalesSilver RETAIN 0 HOURS after each micro-batch.", "Set delta.autoOptimize.optimizeWrite and delta.autoOptimize.autoCompact to true."], "a": [3], "e": "Setting delta.autoOptimize.optimizeWrite and delta.autoOptimize.autoCompact to true reduces the number of small files created by future writes and automatically compacts the remaining fragmentation. Enabling V-Order can improve read performance but does not address small-file creation. VACUUM removes obsolete files and does not combine active small files. Rewriting the pipeline to use RDDs does not address the Delta table optimization requirements and violates the constraint.", "t": 2}, {"q": "You are implementing a data warehouse using Microsoft Fabric.<br>You plan to integrate data from multiple sources, including Microsoft Azure Data Lake Storage Gen2 and Microsoft SQL Server databases.<br>You need to design a process to efficiently load data into tables while ensuring data quality and consistency, and to ensure that all compute resources used for processing are managed through Fabric capacity.<br>Which two tasks should you recommend? Each correct answer presents part of the solution.", "o": ["Use Azure Synapse Analytics for data integration.", "Use Data Factory pipelines for ETL orchestration and T-SQL execution.", "Use dataflows to ingest and transform data from Azure Data Lake Storage Gen2.", "Use SSIS packages for data integration."], "a": [1, 2], "e": "Using Microsoft Data Factory pipelines and dataflows are both effective methods for orchestrating ETL processes and transforming data from various sources into a dimensional model. Microsoft Data Factory pipelines allow for complex orchestration and execution of T-SQL scripts, ensuring efficient data transformation and loading. Dataflows offer a low-code solution for data ingestion and transformation using Power Query, making them suitable for integrating data from Microsoft Azure Data Lake Storage Gen2. Using SSIS packages for data integration is less efficient compared to modern tools like Data Factory and dataflows, especially in a Microsoft Fabric environment. While Azure Synapse Analytics is a powerful tool for data analytics and integration, it is not specifically designed for the ETL processes required to transform and load data into a dimensional model.", "t": 3}, {"q": "You have a Fabric workspace that contains a KQL database.<br>You have data in Azure Event Hubs.<br>You need to store the data in the KQL database. Before the data is stored, unneeded fields must be removed and a calculated field must be added while the events are in motion.<br>Which streaming engine should you use?", "o": ["a Copy activity in a pipeline", "a Copy job", "an eventstream", "direct ingestion into a KQL database and a transformation that uses update policies"], "a": [2], "e": "Eventstreams is the streaming engine in Fabric designed to ingest, filter, enrich, and transform streaming data in motion before routing it to destinations such as an eventhouse. Direct ingestion with update policies performs transformations after the data is stored, which does not meet the requirement to transform the events while they are in motion. Copy activities and Copy jobs are used for batch data movement rather than streaming event processing.", "t": 2}, {"q": "Your company uses a lakehouse architecture with Microsoft Fabric for large-scale data analytics.<br>There are reports about delays in data availability for real-time analytics.<br>You need to optimize the data ingestion process for timely data availability.<br>What should you recommend?", "o": ["Implement data partitioning for faster access.", "Increase the number of data nodes.", "Switch to micro-batch processing for real-time analytics.", "Use Spark Structured Streaming for real-time processing."], "a": [3], "e": "Using Spark Structured Streaming to process data in real-time as it arrives is the correct recommendation because it directly addresses the need for real-time data availability. Implementing data partitioning improves access speed but does not solve ingestion delays. Increasing the number of data nodes does not directly optimize the data ingestion process. Switching to micro-batch processing would still introduce delays, not eliminate them.", "t": 1}, {"q": "Your organization uses Microsoft Fabric for data engineering tasks.<br>Recently, there have been issues with data pipeline runs failing intermittently, causing delays in data processing.<br>You need to monitor data pipeline runs to identify the root cause of failures.<br>What should you do?", "o": ["Extend timeout settings for pipelines.", "Retry failed runs without investigation.", "Use a third-party tool to monitor pipeline runs.", "Use the Monitoring hub to analyze pipeline run details."], "a": [3], "e": "Accessing the Monitoring hub to view and analyze data pipeline run details is the correct approach as it provides insights into the failures, allowing for effective troubleshooting. Using a third-party tool might not provide the same level of integration and detail as the built-in Monitoring hub. Extending timeout settings might lead to inefficiencies without addressing the root cause of the failures. Retrying failed runs without investigation does not solve the underlying issues and can result in repeated failures.", "t": 5}, {"q": "Your company has a data warehouse in Microsoft Fabric to store sales data.<br>Different departments need access to the data, but each department should only see data relevant to their operations.<br>You need to configure the data warehouse so that each department can only view its own sales data.<br>Which two actions should you perform? Each correct answer presents part of the solution.", "o": ["Create a security policy with a filter predicate for departments.", "Create a view that filters data based on department column values.", "Implement column-level security for sensitive sales data.", "Create a function to return department values based on USER_NAME()"], "a": [0, 3], "e": "The correct answers are to create a security policy with a filter predicate for departments and create a function to return department values based on USER_NAME() because implementing Row-Level Security (RLS) in Microsoft Fabric data warehouses requires a predicate function that determines which rows a user can access and a security policy that applies that function as a filter predicate to the table. The function evaluates the current user’s identity (for example, using USER_NAME()) and returns only the department rows they are authorized to see, while the security policy enforces this logic automatically for all queries. Creating a view does not enforce security, and column-level security does not restrict rows, so both are insufficient for ensuring each department only sees its own sales data.", "t": 3}, {"q": "You have an Azure Event Hubs namespace that receives JSON telemetry from 50,000 devices.<br>You have a Fabric workspace that contains an eventhouse and a KQL database.<br>Only a subset of fields is needed for analysis, and some columns must be renamed.<br>You need to transform the events before they are written to a KQL database table and persist only the required fields.<br>What should you use?", "o": ["Create an eventstream that transforms the events and writes the output to the KQL database table.", "Configure Data Activator to filter and rename fields and write the output to the KQL database table.", "Configure direct ingestion into the KQL database table and use an update policy to transform the data after ingestion.", "Use a Real-Time Intelligence hub to explore the stream and persist only the required fields to the KQL database table."], "a": [0], "e": "An eventstream is the correct choice when the data must be transformed before it is written to a KQL database table. It can filter, reshape, and rename fields in-flight, so that only the required data persists. Direct ingestion with an update policy transforms data after ingestion, which does not meet the requirement. A Real-Time Intelligence hub is used to discover and connect to streams, not to implement transformation and persistence logic. Data Activator is used for detection and response scenarios, not stream transformation and loading.", "t": 2}, {"q": "You have a Fabric workspace that uses a Data Factory pipeline. The pipeline calls a child pipeline by using an Execute Pipeline activity.<br>In the child pipeline, a ForEach activity uses the following items expression.<br>@pipeline().parameters.TableList<br>The pipeline run fails and generates the following error.<br>the result of the evaluation of 'foreach' expression '@pipeline().parameters.TableList'<br>is of type 'String'. The result must be a valid array.<br>In the parent pipeline, the Execute Pipeline activity passes the TableList parameter as a string that contains JSON.<br>You need to ensure that the ForEach activity can iterate over the values.<br>What should you change?", "o": ["the TableList parameter type in the child pipeline to String", "the ForEach items expression to @json(pipeline().parameters.TableList)", "the parameter value in the Execute Pipeline activity by using @createArray(...)", "a Set Variable activity that concatenates the values into a comma-separated string"], "a": [1], "e": "Using json() converts the JSON string into an array that the ForEach activity can iterate over. Wrapping the value by using createArray() creates an array that contains a single string instead of converting the JSON string into an array. Changing the parameter type to String prevents iteration. Concatenating the values into a comma-separated string still produces a string rather than an array.", "t": 0}, {"q": "Your company uses Microsoft Fabric for data engineering workflows.<br>You notice that Spark jobs are slow due to suboptimal resource allocation.<br>You need to enhance the Spark job efficiency by adjusting environment settings.<br>What should you do?", "o": ["Enable dynamic allocation of executors.", "Increase the number of partitions.", "Set a fixed memory allocation for executors.", "Set a fixed number of nodes."], "a": [0], "e": "Enabling dynamic allocation of executors in the Spark environment settings is beneficial because it allows the system to adjust resources based on the workload, thereby improving efficiency. Setting a fixed number of nodes or a fixed memory allocation for executors can lead to inefficient resource usage as they do not adapt to varying workloads. Increasing the number of partitions is a common misconception that it will improve job efficiency, but it can lead to overhead and not necessarily enhance resource allocation.", "t": 0}, {"q": "You have a Fabric workspace that contains a SQL database named SalesOps. Developers make schema changes directly to SalesOps by using the query editor.<br>The developers cannot identify which schema changes were previously applied to the SalesOps database.<br>The workspace is connected to an Azure DevOps Git repository for other items in the workspace.<br>You need to ensure that the SalesOps database schema is tracked in Git and that the current database objects are represented as code in the repository.<br>What should you do?", "o": ["Export the database performance summary.", "Commit the database objects to source control.", "Update the database objects from source control.", "Create a OneLake shortcut that points to SalesOps."], "a": [1], "e": "Committing the database objects to source control ensures that the schema is captured as code in the Git repository, enabling version tracking and change history; Updating from source control assumes an existing code representation, which does not yet exist; OneLake shortcuts are used for data access, not schema management; Exporting performance summaries does not capture or track schema changes.", "t": 5}, {"q": "You have a data warehouse named DB1.<br>You need to use a database project to deploy schema changes to DB1.<br>What should you do?", "o": ["Create a new database project.", "Create a new database project, export a data-tier application (DAC) from DB1, and import the DAC into the project.", "Create a new SDK-style project, and import the schema of DB1 into the project.", "Create a new SDK-style project, export a data-tier application (DAC) from DB1, and import the DAC into the project."], "a": [2], "e": "Use an SDK-style SQL Database Project and import the existing database schema; the DAC approaches or non-SDK projects do not meet the requirement.", "t": 3}, {"q": "Your organization uses Microsoft Fabric for data analytics workflows.<br>There are delays in processing due to inefficient monitoring of data ingestion and transformation.<br>You need to implement a solution for effective monitoring of data workflows.<br>What should you do?", "o": ["Configure alerts in the Microsoft Real-Time hub.", "Create a Power BI dashboard.", "Store data events in a data lake.", "Use Azure Monitor."], "a": [0], "e": "Configuring alerts in the Microsoft Real-Time hub is the most effective solution because it provides real-time monitoring and alerting capabilities for data ingestion and transformation processes, directly addressing the organization's needs. Creating a Power BI dashboard, while useful for visualization, lacks the necessary real-time alerting functionality. Storing data events in a data lake is insufficient as it does not offer immediate notifications required for timely responses. Using Azure Monitor is not ideal as it does not specifically target Microsoft Fabric workspace events, making it less effective for this scenario.", "t": 5}, {"q": "Your organization uses Microsoft Fabric to process streaming data from IoT devices.<br>You need to transform the streaming data in real-time for analysis.<br>What should you use?", "o": ["Azure Data Factory for data orchestration.", "Azure Event Hubs for real-time data ingestion.", "Azure Stream Analytics for real-time processing.", "Spark Structured Streaming with Delta tables."], "a": [3], "e": "Spark Structured Streaming with Delta tables is the most suitable solution for real-time data ingestion and transformation due to its ability to efficiently handle streaming data while maintaining data integrity through ACID transactions. Azure Stream Analytics, although capable of real-time processing, does not offer the same level of integration and transformation capabilities. Azure Data Factory is intended for data orchestration and lacks the necessary features for real-time data ingestion and transformation. Azure Event Hubs is designed for real-time data ingestion but does not provide the transformation capabilities needed for real-time analysis.", "t": 2}, {"q": "Your organization uses Microsoft Fabric deployment pipelines to manage analytics solutions across Development, Test, and Production stages.<br>You need to restrict editing of pipeline settings to authorized users only.<br>What should you do?", "o": ["Assign pipeline admin roles.", "Configure workspace permissions.", "Configure item permissions on Environment.", "Implement role-based access control."], "a": [0], "e": "To ensure that only authorized users can edit pipeline settings, assigning pipeline admin roles is essential. This approach maintains security and control over the deployment process. Configuring workspace permissions involves setting access levels for users within a workspace, but it does not specifically restrict editing of pipeline settings. Implementing role-based access control manages user permissions but does not specifically influence who can edit pipeline settings.", "t": 5}, {"q": "You are using Microsoft Fabric Warehouse to manage data ingestion and transformation.<br>You need to set up a solution to ingest batch data from multiple CSV files stored in Azure Blob Storage. The solution must ensure the process is efficient and handles errors effectively.<br>Which three actions should you perform? Each correct answer presents part of the solution.", "o": ["Specify a location for rejected rows.", "Transform data with Azure Data Lake Storage Gen2 before ingestion.", "Transform data with Power BI before ingestion.", "Use the COPY statement to load data.", "Use wildcards in the path to load multiple files."], "a": [0, 3, 4], "e": "To achieve efficient data ingestion and effective error handling, it is crucial to use the COPY statement, specify a REJECTED_ROW_LOCATION, and use wildcards. The COPY statement is optimal for loading data from Microsoft Azure Blob Storage, ensuring efficiency. Specifying a REJECTED_ROW_LOCATION enhances error management by isolating problematic rows for further analysis. Using wildcards allows for the bulk loading of multiple files, streamlining the process. Transforming data with Power BI or Azure Data Lake Storage Gen2 before ingestion adds unnecessary complexity when the focus is on efficient ingestion using the COPY statement.", "t": 3}, {"q": "Your company uses Microsoft Fabric to manage a large-scale data lakehouse containing numerous Delta tables. The tables are frequently updated using notebooks and queried by various analytics teams.<br>You notice that query performance has degraded over time, leading to increased processing times and higher costs.<br>You need to recommend maintenance strategies to enhance the efficiency of Delta tables in a lakehouse.<br>Which three actions should you recommend? Each correct answer presents part of the solution.", "o": ["Apply V-Order.", "Enable Delta caching.", "Use the OPTIMIZE command", "Reduce the retention period.", "Use the VACUUM command."], "a": [0, 2, 4], "e": "Applying V-Order optimizes sorting, encoding, and compression of Delta Parquet files, enhancing read operations and maintaining efficient query performance. Performing bin-compaction consolidates small Parquet files into larger ones, improving read efficiency and reducing the number of files scanned during queries. Using the VACUUM command removes old files, optimizing storage costs and potentially improving query performance by reducing clutter. Reducing the retention period might seem beneficial for performance but can lead to data loss and compromise Delta's time travel capabilities. Enabling Delta caching might seem beneficial for performance but can lead to increased memory usage and potential performance degradation if not managed properly.", "t": 1}, {"q": "You have a Fabric lakehouse that contains a Delta table named orders. orders contains the following columns: o_orderkey, o_orderstatus, o_orderpriority, and o_totalprice.<br>You run PySpark transformations in a notebook to produce a summary dataset. Only rows where o_orderstatus = 'F' must be included.<br>You need a DataFrame that:<br>- Returns one row per o_orderpriority<br>- Includes the count of finalized orders per priority as n_orders<br>- Is sorted by n_orders in descending order<br>Which PySpark code should you use?", "o": ["from pyspark.sql.functions import col, count<br>df_result = (<br>df_order<br>.filter(col(\"o_orderstatus\") == \"F\")<br>.groupBy(\"o_orderpriority\")<br>.agg(count(\"o_orderkey\").alias(\"n_orders\"))<br>.sort(col(\"n_orders\").desc())<br>)", "from pyspark.sql.functions import col, count<br>df_result = (<br>df_order<br>.filter(col(\"o_orderstatus\") == \"F\")<br>.groupBy(\"o_orderpriority\")<br>.agg(count(\"o_totalprice\").alias(\"n_orders\"))<br>.sort(col(\"o_orderpriority\").desc())<br>)", "from pyspark.sql.functions import col, count<br>df_result = (<br>df_order<br>.filter(col(\"o_orderstatus\") == \"F\")<br>.groupBy(\"o_orderpriority\", \"o_orderstatus\")<br>.agg(count(\"o_orderkey\").alias(\"n_orders\"))<br>.sort(col(\"n_orders\").desc())<br>)", "from pyspark.sql.functions import col, count<br>df_result = (<br>df_order<br>.groupBy(\"o_orderpriority\")<br>.agg(count(\"o_orderkey\").alias(\"n_orders\"))<br>.filter(col(\"o_orderstatus\") == \"F\")<br>.sort(col(\"n_orders\").desc())<br>)"], "a": [0], "e": "The correct solution filters finalized orders first, groups by o_orderpriority, counts rows by using o_orderkey, and sorts by the resulting n_orders column in descending order. Option B attempts to filter after aggregation and references a column that is no longer present. Option C groups by both priority and status, which produces multiple rows per priority. Option D sorts by priority instead of the count and counts a different column, which does not satisfy the requirement to sort by the number of finalized orders.", "t": 1}, {"q": "You have a table named CustomerInfo table that contains the following columns: CustomerID, Name, Address, and CreditCardNumber.<br>You have a data governance policy that all Credit Card Numbers must have all but last 4 characters masked.<br>What should you do?", "o": ["ALTER TABLE CustomerInfo ALTER COLUMN CreditCardNumber ADD MASKED WITH (FUNCTION = 'default()');", "ALTER TABLE CustomerInfo ALTER COLUMN CreditCardNumber ADD MASKED WITH (FUNCTION = 'partial(0,\"XXXX-XXXX-XXXX-\",4)');", "CREATE VIEW MaskedCustomerInfo AS SELECT CustomerID, Name, Address, 'XXXX-XXXX-XXXX-XXXX' AS CreditCardNumber FROM CustomerInfo;", "CREATE VIEW PublicCustomerInfo AS SELECT CustomerID, Name, Address, CreditCardNumber FROM CustomerInfo;"], "a": [1], "e": "The SQL statement to add a partial mask to the CreditCardNumber column effectively complies with the data governance policy by displaying only the last four digits, which is a standard practice for credit card masking. Adding a default mask would not provide the necessary partial masking. Creating a view with static masked values fails to provide dynamic masking based on user permissions, which is necessary for compliance. Creating a view without applying any masking does not protect the data.", "t": 4}, {"q": "Your company is implementing a new data governance strategy using Microsoft Fabric.<br>The data warehouse contains various tables with sensitive information that must be protected from unauthorized access.<br>You need to ensure only authorized medical personnel can access the MedicalHistory column in the Patients table.<br>What should you use?", "o": ["Column-Level Security", "Dynamic Data Masking", "Row-Level Security", "Workspace Roles"], "a": [0], "e": "Column-Level Security is essential for ensuring that only authorized medical personnel can access the 'MedicalHistory' column in the 'Patients' table. It allows for precise control over who can view specific columns, meeting the requirement for protecting sensitive information. Dynamic Data Masking, while useful for obscuring data, does not restrict access to specific columns. Row-Level Security focuses on controlling access to specific rows based on user roles, which does not address the need for column-specific access control. Workspace Roles provide permissions at the workspace level but lack the granularity needed for column-specific restrictions.", "t": 3}, {"q": "Your company uses a Microsoft Fabric data warehouse to store frequently updated customer transaction data.<br>You need to design an ETL process that minimizes load on source systems while ensuring only new or changed data is loaded.<br>What should you include in your design?", "o": ["Implement a trigger-based change detection.", "Perform nightly full data loads.", "Use a timestamp column for incremental data loading.", "Use Change Data Capture (CDC) for tracking source data changes."], "a": [3], "e": "Using Change Data Capture (CDC) is the most efficient method for tracking changes in the source data, allowing only new or changed data to be loaded into the warehouse, thus minimizing the load on the source systems. Performing a full data load every night is inefficient and places unnecessary load on the source systems, making it unsuitable for frequent updates. Using a timestamp column for incremental data loading may not capture all changes as effectively as CDC, particularly in complex scenarios. Implementing a trigger-based change detection can introduce complexity and may not efficiently handle large volumes of data changes, making it less effective for this scenario.", "t": 3}, {"q": "Your company has implemented a Microsoft Fabric data warehouse to handle large-scale data ingestion and processing.<br>The current setup involves frequent data loads throughout the day, which sometimes lead to performance bottlenecks.<br>You need to optimize the data ingestion process to handle large volumes efficiently without causing performance issues.<br>Which two actions should you perform? Each correct answer presents part of the solution.", "o": ["Divide large INSERT operations into smaller parts.", "Group INSERT statements into batches.", "Use larger data types for columns.", "Use smaller data types for columns."], "a": [0, 1], "e": "Grouping INSERT statements into batches reduces transaction overhead, thereby improving performance during data ingestion. Dividing large INSERT operations into smaller parts minimizes rollback time and enhances system responsiveness, making it an effective strategy for handling large data volumes. Using smaller data types for columns can lead to data truncation or loss if not carefully considered, which is counterproductive to the goal of optimizing data ingestion.", "t": 3}, {"q": "You have a Fabric eventstream named TollEvents that ingests events containing fields named TollId and EntryTime. The query uses TIMESTAMP BY EntryTime.<br>You need to aggregate counts by TollId by using the following windows in the same query:<br>- 1 minute<br>- 15 minutes (hop 1 minute)<br>- 30 minutes (hop 1 minute)<br>- 60 minutes (hop 1 minute)<br>Each output row must include a non-null label that identifies which window produced the result.<br>What should you add to the query?", "o": ["Windows(<br>TumblingWindow(minute,1),<br>HoppingWindow(minute,15,1),<br>HoppingWindow(minute,30,1),<br>HoppingWindow(minute,60,1)<br>),<br>System.Window().Id", "Windows(<br>TumblingWindow(minute,1),<br>TumblingWindow(minute,15,1),<br>TumblingWindow(minute,30,1),<br>TumblingWindow(minute,60,1)<br>),<br>System.Window().Id", "Windows(<br>Window('1 min', TumblingWindow(minute,1)),<br>Window('15 min', HoppingWindow(minute,15,1)),<br>Window('30 min', HoppingWindow(minute,30,1)),<br>Window('60 min', HoppingWindow(minute,60,1))<br>),<br>System.Window().Id", "Windows(<br>Window('1 min', TumblingWindow(minute,1)),<br>Window('15 min', TumblingWindow(minute,15,1)),<br>Window('30 min', TumblingWindow(minute,30,1)),<br>Window('60 min', TumblingWindow(minute,60,1))<br>),<br>System.Window().Id"], "a": [2], "e": "Naming each window with the Window() wrapper enables System.Window().Id to return a non-null label for each window result. Unnamed windows do not produce a window identifier. Partitioning with TIMESTAMP BY ... OVER does not create window labels. System.Timestamp() returns the event timestamp rather than the window identifier.", "t": 2}, {"q": "Your company uses Microsoft Fabric Lakehouse to store and analyze large datasets.<br>You notice increased storage costs due to old files that are no longer needed for current operations.<br>You need to reduce storage costs by removing unnecessary files while maintaining data integrity.<br>What should you do?", "o": ["Enable V-Order compression.", "Reduce file retention period.", "Use the OPTIMIZE command.", "Use VACUUM command."], "a": [3], "e": "The VACUUM command effectively removes unreferenced files older than the retention threshold, reducing storage costs while maintaining data integrity. Enabling V-Order compression optimizes file compression and read performance but does not remove unnecessary files. Reducing the file retention period might seem like a cost-saving measure but can compromise data integrity and affect Delta's time travel capabilities. Using the OPTIMIZE command consolidates files for performance but does not remove unnecessary files, which is needed to reduce storage costs.", "t": 1}, {"q": "You have a large dataset stored in a Microsoft Fabric Lakehouse, including sales transactions from multiple regions.<br>You need to implement a strategy to support incremental data loads while maintaining data integrity and consistency.<br>Which two actions should you perform? Each correct answer presents part of the solution.", "o": ["Adopt a medallion architecture for data organization.", "Load data directly into the dimensional model without transformation.", "Use Data Factory pipelines for data transformation.", "Use Dataflows Gen2 for data transformation and cleaning."], "a": [0, 3], "e": "Adopting a medallion architecture for data organization and using Dataflows Gen2 for data transformation and cleaning are both effective strategies for ensuring high data quality and supporting incremental data loads. A medallion architecture organizes data into layers, allowing for efficient incremental loading and ensuring data quality at each stage of the transformation process. Microsoft Dataflows Gen2, based on Power Query, provide a visual and code-free way to transform and clean data, ensuring high data quality before loading into the dimensional model. Loading data directly into the dimensional model without transformation can lead to inconsistencies and poor data quality, which is not suitable for a dimensional model that requires cleansed and conformed data. Using Data Factory pipelines for data transformation is less efficient compared to the automated solutions provided by Dataflows Gen2 and medallion architecture.", "t": 1}, {"q": "Your company uses Microsoft Fabric to manage large-scale data processing tasks.<br>You notice performance issues with Spark jobs involving complex transformations and aggregations on Delta format data.<br>You need to enhance performance of these Spark jobs without modifying the existing codebase.<br>What should you do?", "o": ["Enable adaptive query execution.", "Enable dynamic allocation.", "Enable high concurrency mode.", "Enable native execution engine."], "a": [3], "e": "Enabling native execution engine in environment settings optimizes performance for complex Spark jobs without code modifications. Enabling dynamic allocation can lead to resource inefficiencies and does not directly enhance performance for complex transformations and aggregations. Enabling high concurrency mode allows multiple users to share Spark sessions, but it does not directly enhance performance for complex transformations and aggregations. Enabling adaptive query execution is a common consideration for optimizing Spark job performance, but it does not directly address the specific performance issues related to complex transformations and aggregations on Delta format data.", "t": 1}]}];

function home(){view='home';app.innerHTML=`<h1>Microsoft Fabric Practice Tests</h1><div class="mu">${tot()} questions. Pick a set, build a custom test, or browse the question bank.</div><div class="row" style="margin:12px 0 0"><button class="b g" onclick="bank()">Browse question bank</button></div>`+resumeHTML()+'<div class="grid">'+
DATA.map((s,k)=>s.custom?'':`<button class="set" onclick="start(${k})"><b>${s.name}</b>${s.q.length} questions${pt(s)}<div class="best">${bestTxt(k)}</div></button>`).join('')+'</div>'+customHTML()+histHTML()+toolsHTML()}
function start(k){S=k;i=0;sel=DATA[k].q.map(()=>[]);done=DATA[k].q.map(()=>false);fl=DATA[k].q.map(()=>false);saveProg();show()}
function show(){view='quiz';const q=DATA[S].q[i],n=DATA[S].q.length,multi=q.a.length>1,d=done[i];
app.innerHTML=`<div class="top2"><button class="b hm" onclick="home()">${HI} Home</button><b>${DATA[S].name}</b></div>
<div class="card"><div class="mu">Question ${i+1} of ${n}<span class="tag">${multi?'Select '+q.a.length:'Single choice'}</span>${fl[i]?'<span class="tag" style="background:var(--pt);color:var(--ptb)">Flagged</span>':''}</div><div class="bar"><i style="width:${(i+1)/n*100}%"></i></div>
<h3 style="margin:8px 0 12px">${q.q}</h3><div id="opts">`+q.o.map((t,k)=>{let c='opt'+(d?' lock':''),ck=sel[i].includes(k);if(d){if(q.a.includes(k))c+=' ok';else if(ck)c+=' no'}
return `<label class="${c}"><input type="${multi?'checkbox':'radio'}" name="o" ${ck?'checked':''} ${d?'disabled':''} onchange="pick(${k})"><span>${t}</span></label>`}).join('')+`</div><div id="fb">${d?fb():''}</div><div class="msg" id="msg"></div>
<div class="row"><button class="b g" onclick="check()" ${d?'disabled':''}>Check answers</button><button class="b" onclick="next()">${i==n-1?'Submit':'Next'}</button><button class="b g" onclick="flag()">${fl[i]?'Unflag':'Flag for review'}</button></div>
<div class="mu ks" style="margin-top:10px">Keys: 1-9 select, Enter check/next, F flag, left/right arrows move</div></div>
<div class="card"><b>Navigator</b><div class="mu ks">Filled = answered, dot = flagged, outlined = current</div><div class="nav">`+DATA[S].q.map((_,k)=>`<button class="nb${sel[k].length?' ans':''}${fl[k]?' flg':''}${k==i?' cur':''}" onclick="go(${k})">${k+1}</button>`).join('')+'</div></div>'}
function go(k){i=k;saveProg();show()}function flag(){fl[i]=!fl[i];saveProg();show()}
function saveProg(){try{localStorage.setItem('fabprog',JSON.stringify({S,i,sel,done,fl,ids:DATA[S].custom?DATA[S].q.map(q=>q.id):null,t:Date.now()}))}catch(e){}}
function clearProg(){try{localStorage.removeItem('fabprog')}catch(e){}}
function getProg(){try{const p=JSON.parse(localStorage.getItem('fabprog')||'null');if(!p)return null;const s=p.ids?{name:'Custom Test',custom:true,q:p.ids.map(x=>ALL[x]).filter(Boolean)}:DATA[p.S];if(!s||!s.q.length||p.sel.length!=s.q.length||(p.ids&&s.q.length!=p.ids.length))return null;p.s=s;return p}catch(e){return null}}
function resumeHTML(){const p=getProg();if(!p)return '';const a=p.sel.filter(x=>x.length).length;return `<div class="card" style="border-color:var(--ac)"><b>Unfinished test</b><div class="mu" style="margin:4px 0 8px">${p.s.name}: question ${p.i+1} of ${p.s.q.length}, ${a} answered</div><div class="row" style="margin:0"><button class="b" onclick="resume()">Resume</button><button class="b g" onclick="clearProg();home()">Discard</button></div></div>`}
function resume(){const p=getProg();if(!p)return home();S=p.S;if(p.ids)DATA[S]=p.s;i=p.i;sel=p.sel;done=p.done;fl=p.fl||p.sel.map(()=>false);show()}
function customHTML(){return `<div class="card"><b>Custom test builder</b><div class="mu" style="margin:4px 0 10px">Choose topics and a length. Questions are drawn at random from all sets.</div><div class="chips">`+TOPICS.map((t,k)=>`<label class="chip"><input type="checkbox" class="ct" value="${k}" ${ctSel.includes(k)?'checked':''}> ${t}</label>`).join('')+`</div><div class="row" style="align-items:center;margin-top:0"><label>Questions <input id="cn" class="inp" type="number" min="5" max="50" value="${cn}" style="width:80px"></label><button class="b" onclick="buildCustom()">Start custom test</button></div><div class="msg" id="cm"></div></div>`}
function buildCustom(){ctSel=[...document.querySelectorAll('.ct')].filter(x=>x.checked).map(x=>+x.value);cn=Math.max(5,Math.min(50,+document.getElementById('cn').value||20));const P=ALL.filter(q=>ctSel.includes(q.t));if(!P.length){document.getElementById('cm').textContent='Pick at least one topic.';return}
for(let x=P.length-1;x>0;x--){const y=Math.floor(Math.random()*(x+1));[P[x],P[y]]=[P[y],P[x]]}DATA[DATA.length>5?5:DATA.length]={name:'Custom Test',custom:true,q:P.slice(0,cn)};start(DATA.findIndex(s=>s.custom))}
function bank(){view='bank';app.innerHTML=`<div class="top"><button class="b hm" onclick="home()">${HI} Home</button><b>Question bank</b></div><div class="card"><div class="row" style="margin:0"><input id="bs" class="inp" placeholder="Search questions, options, explanations" value="${bq.replace(/"/g,'&quot;')}" oninput="bq=this.value;bn=25;bankR()" style="flex:1;min-width:200px"><select class="inp" onchange="bt=+this.value;bn=25;bankR()"><option value="-1">All topics</option>${TOPICS.map((t,k)=>`<option value="${k}" ${bt==k?'selected':''}>${t}</option>`).join('')}</select></div><div class="mu ks" id="bc" style="margin-top:8px"></div></div><div id="bl"></div>`;bankR()}
function bankR(){const s=bq.toLowerCase().trim(),R=ALL.filter(q=>(bt<0||q.t==bt)&&(!s||(q.q+' '+q.o.join(' ')+' '+q.e).toLowerCase().includes(s)));document.getElementById('bc').textContent=R.length+' questions';
document.getElementById('bl').innerHTML=R.slice(0,bn).map(q=>`<details class="card"><summary><b>${q.q}</b> <span class="tag">${TOPICS[q.t]}</span></summary><div style="margin-top:10px">`+q.o.map((t,x)=>`<div class="opt lock${q.a.includes(x)?' ok':''}"><span>${L[x]}. ${t}${q.a.includes(x)?' <em class="mu">(correct)</em>':''}</span></div>`).join('')+`<div class="exp ok"><b>Explanation:</b> ${q.e}</div></div></details>`).join('')+(R.length>bn?`<div class="row" style="justify-content:center"><button class="b g" onclick="bn+=25;bankR()">Show more (${R.length-bn} left)</button></div>`:'')}
function toolsHTML(){const ios=typeof navigator!='undefined'&&/iphone|ipad|ipod/i.test(navigator.userAgent||'');return `<div class="card"><b>Tools</b><div class="row" style="margin-top:10px"><button class="b g" onclick="exportP()">Export progress</button><button class="b g" onclick="document.getElementById('imp').click()">Import progress</button><button class="b g" id="inst" onclick="installApp()" style="${dip?'':'display:none'}">Install app</button></div><input type="file" id="imp" accept=".json,application/json" hidden onchange="importP(event)"><div class="mu ks" style="margin-top:8px">${ios?'To install on iPhone: tap Share, then Add to Home Screen.':'To install on a phone: use the browser menu, Install app or Add to Home Screen.'} Export saves your history as a file you can import on another device.</div></div>`}
function installApp(){if(dip){dip.prompt();dip=null;document.getElementById('inst').style.display='none'}}
function mergeHist(a){const have=new Set(hist.map(h=>h.t+'-'+h.k));let add=0;a.forEach(h=>{if(!h||![h.k,h.c,h.n,h.p,h.t].every(Number.isFinite)||typeof h.name!='string'||have.has(h.t+'-'+h.k))return;have.add(h.t+'-'+h.k);hist.push({k:h.k,name:h.name.replace(/[<>&"']/g,'').slice(0,40),c:h.c,n:h.n,p:h.p,tp:Array.isArray(h.tp)&&h.tp.length==TOPICS.length&&h.tp.every(v=>Array.isArray(v)&&v.length==2&&v.every(Number.isFinite))?h.tp:undefined,t:h.t});add++});hist.sort((x,y)=>y.t-x.t);saveH();hp=0;return add}
function exportP(){const b=new Blob([JSON.stringify({app:'cert-practice-hub',v:1,hist})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cert-practice-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Progress exported')}
function importP(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),a=Array.isArray(d)?d:d.hist;if(!Array.isArray(a))throw 0;const n=mergeHist(a);home();toast(n+' attempts imported')}catch(e){toast('That file is not a valid progress backup')}};r.readAsText(f);ev.target.value=''}
function shareScore(){const[c,n,p]=score(),x=`I scored ${p}% (${p>=PASS?'PASS':'FAIL'}) on ${DATA[S].name} in Cert Practice Hub. Try it:`,u=location.href.split('#')[0].split('?')[0];
if(navigator.share)navigator.share({title:'Cert Practice Hub',text:x,url:u}).catch(()=>{});else(navigator.clipboard?navigator.clipboard.writeText(x+' '+u):Promise.reject()).then(()=>toast('Score copied to clipboard')).catch(()=>prompt('Copy your score:',x+' '+u))}
function pick(k){if(done[i])return;const a=DATA[S].q[i].a.length;if(a>1){const x=sel[i].indexOf(k);if(x>=0)sel[i].splice(x,1);else if(sel[i].length>=a){show();document.getElementById('msg').textContent='You can select only '+a+' options. Uncheck one first.';return}else sel[i].push(k)}else sel[i]=[k];document.getElementById('msg').textContent=''}
const same=(a,b)=>a.length==b.length&&a.every(x=>b.includes(x)),pts=(q,s)=>s.filter(x=>q.a.includes(x)).length;
function st(q,s){const p=pts(q,s),n=q.a.length;return p==n?['ok','Correct!']:p>0?['pt','Partially correct ('+p+' of '+n+' points).']:['no',s.length?'Incorrect.':'Not answered.']}
function fb(){const q=DATA[S].q[i],[c,m]=st(q,sel[i]);return `<div class="exp ${c}"><b>${m}</b> ${c=='ok'?'':'Correct answer: '+q.a.map(k=>L[k]).join(', ')+'.'}<br>${q.e}</div>`}
function check(){if(!sel[i].length){document.getElementById('msg').textContent='Please select an answer first.';return}done[i]=true;show()}
function next(){const n=DATA[S].q.length;if(!done[i]&&!sel[i].length&&!confirm('No answer selected. Skip this question?'))return;if(i<n-1){i++;show()}else finish()}
function score(){let c=0,n=0;DATA[S].q.forEach((q,k)=>{c+=pts(q,sel[k]);n+=q.a.length});return[c,n,Math.round(c/n*100)]}
function finish(){const[c,n,p]=score();addHist(S,c,n,p);result()}
function result(){const[c,n,p]=score(),ok=p>=PASS;
app.innerHTML=`<div class="card"><h2 style="text-align:center">${DATA[S].name} complete</h2><div class="res"><div class="big" style="color:${ok?'var(--okb)':'var(--nob)'}">${p}%</div>${badge(p)}</div><p style="text-align:center">${c} of ${n} ${n==DATA[S].q.length?'questions':'points'} correct. Pass mark is ${PASS}%. ${ok?'Nice work!':'Keep practicing, you can beat this.'}</p><div class="row" style="justify-content:center"><button class="b g" onclick="home()">Back to home</button><button class="b g" onclick="start(S)">Retry this set</button><button class="b" onclick="review()">Review answers</button><button class="b g" onclick="shareScore()">Share score</button></div></div>`;window.scrollTo(0,0)}
function review(){const Q=DATA[S].q,[c,n,p]=score();
app.innerHTML=`<div class="top"><button class="b hm" onclick="home()">${HI} Home</button><button class="b g" onclick="result()">Back to result</button><span><b>${DATA[S].name}</b> review: ${c}/${n} (${p}%) ${badge(p)}</span></div>`+
Q.map((q,k)=>{const m=q.a.length>1,[c,msg]=st(q,sel[k]);
return `<div class="card"><div class="mu">Question ${k+1} of ${Q.length}<span class="tag">${m?'Select '+q.a.length:'Single choice'}</span><span class="pf ${c}" style="margin-left:8px;font-size:12px;padding:2px 10px">${c=='ok'?'Correct':c=='pt'?'Partial':sel[k].length?'Incorrect':'Not answered'}</span></div><h3 style="margin:8px 0 12px">${q.q}</h3>`+
q.o.map((t,x)=>{const s=sel[k].includes(x),g=q.a.includes(x);return `<div class="opt lock${g?' ok':s?' no':''}"><input type="${m?'checkbox':'radio'}" disabled ${s?'checked':''}><span>${t}${s?' <em class="mu">(your answer)</em>':''}${g?' <em class="mu">(correct)</em>':''}</span></div>`}).join('')+
`<div class="exp ${c}"><b>${msg}</b> ${c=='ok'?'':'Correct answer: '+q.a.map(x=>L[x]).join(', ')+'.'}<br>${q.e}</div></div>`}).join('')+
`<div class="row"><button class="b hm" onclick="home()">${HI} Home</button><button class="b g" onclick="window.scrollTo(0,0)">Back to top</button></div>`;window.scrollTo(0,0)}
{const w=[['pick',x=>{saveProg()}],['check',x=>{saveProg()}],['next',x=>{if(view=='quiz')saveProg()}]];const o={pick,check,next,finish,result,review};
pick=function(k){o.pick(k);saveProg()};check=function(){o.check();saveProg()};next=function(){o.next();if(view=='quiz')saveProg()};
finish=function(){clearProg();o.finish()};result=function(){view='other';o.result()};review=function(){view='other';o.review()}}
document.addEventListener('keydown',e=>{if(view!='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key,q=DATA[S].q[i],n=DATA[S].q.length;
if(/^[1-9]$/.test(k)){if(+k<=q.o.length&&!done[i]){const full=q.a.length>1&&!sel[i].includes(+k-1)&&sel[i].length>=q.a.length;pick(+k-1);if(!full)show()}}
else if(k=='Enter'){e.preventDefault();done[i]||!sel[i].length?next():check()}else if(k=='f'||k=='F')flag();else if(k=='ArrowRight'){e.preventDefault();go(Math.min(i+1,n-1))}else if(k=='ArrowLeft'){e.preventDefault();go(Math.max(i-1,0))}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;const b=document.getElementById('inst');if(b)b.style.display=''});
if(typeof navigator!='undefined'&&'serviceWorker' in navigator&&typeof location!='undefined'&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
home();
</script></body></html>
